name: Welcome first-time contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greet:
    name: Comment on first issue / PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: First-interaction welcome
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d  # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue here. 🙏

            A few things that help us help you:

            - **For factual corrections** (wrong tax rate, dead URL, ENDED programme listed as active), please link a **primary government source** — see [`shared/anti-hallucination.md`](../blob/main/shared/anti-hallucination.md) for what counts.
            - **For new countries**, please skim [`CONTRIBUTING.md`](../blob/main/CONTRIBUTING.md) — the bar is FR/IT/CZ/SK density (~400-500 lines, 22 sections).
            - **For regulatory-watch entries**, please include the effective date + tier (1-4) per the schema in [`shared/regulatory-watch.md`](../blob/main/shared/regulatory-watch.md).

            A maintainer will triage shortly.

          pr-message: |
            Thanks for your first pull request here. 🚀

            **Before review starts**, please confirm:

            - [ ] Anti-hallucination contract followed — see [`CONTRIBUTING.md`](../blob/main/CONTRIBUTING.md) § Anti-hallucination contract
            - [ ] Primary government sources cited (not aggregator sites)
            - [ ] Status footer present in any touched playbook (`**Confidence**` + `**Last verified**`)
            - [ ] CHANGELOG.md updated under `## [Unreleased]` (or apply a `skip changelog` label if trivial)

            CI will run the validation suite (markdown lint, forbidden-phrasings, Last-verified stamp, personal-data guard). Once green, a maintainer will review.

            Thanks again — factual corrections in particular are the highest-value contribution to this project.
