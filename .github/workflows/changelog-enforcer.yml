name: Changelog enforcer

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` so applying a skipLabel below re-evaluates the gate
    # instead of leaving a stale red that needs a manual re-run. Note this only
    # fires for human- or PAT-applied labels: GitHub's recursion prevention means
    # a label applied by GITHUB_TOKEN (our path-based labeler) emits no event.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NOT cancel-in-progress. This job publishes a REQUIRED status context, and a
  # `cancelled` check-run for a required context blocks the merge even when a
  # newer successful run of the same context exists (observed on #337: the
  # `labeled` run cancelled the `opened` run, succeeded, and the PR still sat at
  # mergeStateStatus=BLOCKED until the cancelled suite was re-run). Since adding
  # the `labeled` trigger below, opening a PR with a label — `gh pr create
  # --label`, or a maintainer applying a skip label — reliably races these two
  # events. The job takes ~10s, so cancelling buys nothing worth that trap.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    name: CHANGELOG entry under [Unreleased]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify CHANGELOG.md updated under [Unreleased]
        uses: dangoslen/changelog-enforcer@8b5e9dc3121363bb7c0115f8533404d92af382de  # v3.7.0
        with:
          changeLogPath: CHANGELOG.md
          # Note: NOT setting `expectedLatestVersion`. The action's
          # validateLatestVersion treats versions[1] as the "latest" when
          # [Unreleased] is first, so `expectedLatestVersion: Unreleased`
          # only works on a project that has *only* Unreleased and no real
          # releases yet. Once a real release ([2026.04.0]) exists, this check
          # fails on every PR. We just want "did the PR touch CHANGELOG?",
          # which is the action's behaviour with no expectedLatestVersion.
          # Skip enforcement when these labels are applied — for trivial PRs
          # that don't need a changelog line (typo fixes, CI tweaks, dep bumps).
          # The action expects a COMMA-separated list (NOT newline-separated).
          skipLabels: 'skip changelog,documentation,ci,dependencies,github-actions,duplicate,wontfix'
