name: Dependabot auto-merge

# Auto-merge policy for Dependabot PRs once required CI is green:
#   - patch + minor bumps from ANY ecosystem         -> auto-merge
#   - MAJOR bumps from the `github_actions` ecosystem -> auto-merge
#   - MAJOR bumps from real runtime deps (npm/pip/…)  -> human review
#
# Rationale for auto-merging major github_actions bumps: every action is
# SHA-pinned (Dependabot rewrites both the SHA and the `# vX.Y.Z` comment),
# CodeQL's "Analyze actions" job runs on the PR, and the same required-status
# gate that protects main applies. A major action bump that keeps all of that
# green is safe to land unattended on a solo-maintained docs repo.
#
# Caveat for future maintainers: a few actions are only exercised at release
# time (e.g. softprops/action-gh-release in sign-release.yml runs on tag push,
# not on PR CI). A major bump to a release-only action will auto-merge on green
# PR checks even though those checks never ran it — a break would only surface
# at the next release. If that bites, special-case those actions back to manual
# by matching dependency-names in the decision step below.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot patch/minor + major github_actions PRs once CI green
    runs-on: ubuntu-latest
    # Author and head repo, not just the actor: a fork's own Dependabot can push to
    # a fork branch that has a PR open here.
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to auto-merge
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          # Patch + minor from any ecosystem; major ONLY from github_actions.
          merge=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              merge=true ;;
            version-update:semver-major)
              if [ "$ECOSYSTEM" = "github_actions" ]; then merge=true; fi ;;
          esac
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "update-type=$UPDATE_TYPE  ecosystem=$ECOSYSTEM  ->  auto-merge=$merge"

      - name: Approve eligible update
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve -b "Auto-approved Dependabot update (patch/minor any ecosystem, or major github_actions) with CI green."
        continue-on-error: true

      - name: Enable auto-merge (squash)
        if: steps.decide.outputs.merge == 'true'
        env:
          # AUTOMERGE_TOKEN (optional): a PAT carrying the `workflow` scope. Set it
          # to make auto-merge deterministic for github_actions bumps — see below.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Every github_actions bump edits .github/workflows/*, and GitHub
        # intermittently refuses enablePullRequestAutoMerge for those PRs with
        # "refusing to allow a GitHub App to create or update workflow ... without
        # `workflows` permission". GITHUB_TOKEN can never satisfy that: there is no
        # `workflows` key in the Actions permissions block. Dependabot re-runs this
        # job on every rebase and it clears on a later attempt, so treat the refusal
        # as a warning rather than a red build; any other error still fails loudly.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if out=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if ! grep -qF 'without `workflows` permission' <<<"$out"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::warning::Auto-merge refused: GITHUB_TOKEN lacks the \`workflows\` scope needed for a PR touching .github/workflows/*. Dependabot retries on its next rebase; set the AUTOMERGE_TOKEN secret (PAT with \`workflow\` scope) to make this deterministic, or merge manually."

  relock:
    # Dependabot regenerates requirements.txt on Python >= 3.13, which drops
    # typing-extensions (aiosignal needs it below 3.13), so every pip PR fails the
    # byte-exact "requirements.txt matches requirements.in" gate. Re-render the lock
    # with the repo helper, seeded so Dependabot's new pins are kept.
    name: Relock requirements.txt on Dependabot pip PRs
    runs-on: ubuntu-latest
    # Same guard as auto-merge, so the head is Dependabot's own branch in this repo.
    # The actor check also skips the run our own push triggers, so this cannot loop.
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'dependabot/pip/')
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: relock-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout the Dependabot head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Dependabot's commit sits directly on main; HEAD^ carries main's lock.
          fetch-depth: 2
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Must match pr-validate.yml: the gate compares bytes, and uv's rendering
          # can change between releases.
          version: "0.12.2"

      - name: Regenerate the lock
        id: relock
        # --base keeps main's pin for the package Dependabot dropped; without it uv
        # takes the newest release, which could be a major the PR never announced.
        run: |
          set -euo pipefail
          git show HEAD^:requirements.txt > "$RUNNER_TEMP/base-requirements.txt"
          python3 scripts/lock-requirements.py --base "$RUNNER_TEMP/base-requirements.txt"
          git diff --quiet -- requirements.txt || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the fix to the Dependabot branch
        if: steps.relock.outputs.changed == 'true'
        env:
          # A PAT, not GITHUB_TOKEN: checks on a GITHUB_TOKEN push wait for manual
          # approval. Dependabot-triggered runs read only the Dependabot secret store,
          # where AUTOMERGE_TOKEN already lives (fine-grained, this repo, Contents RW).
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        # `[dependabot skip]` lets Dependabot keep rebasing over this commit; each
        # rebase re-triggers this job. After this push the PR's checks run as the PAT
        # owner, outside Dependabot's sandbox: no PR-triggered job may install
        # requirements.txt while secrets or write scopes are in reach.
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTOMERGE_TOKEN is missing from the Dependabot secret store (fine-grained PAT, this repo only, Contents read/write)."
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm 'chore(deps): relock requirements.txt for Python 3.12 [dependabot skip]' -- requirements.txt
          gh auth setup-git
          git push origin "HEAD:refs/heads/${HEAD_REF}"
