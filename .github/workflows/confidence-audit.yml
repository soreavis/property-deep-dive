name: Confidence audit

# Audits primary-source URL count vs declared `**Confidence**:` level per playbook,
# using thresholds in scripts/audit-confidence.py. Catches confidence-overclaims
# mechanically (e.g., a HIGH-confidence playbook citing only 8 government URLs).
#
# Enforcing (strict) since 2026-06-19: every playbook now meets its tier×confidence
# primary-source floor (0 below threshold after the allowlist recalibration that
# taught is_primary_host the national-ccTLD government domains it had been blind to).
# A PR that adds an under-sourced playbook — or overclaims Confidence — now fails CI.
# Run the script with --warn-only locally for a non-failing soft check.

on:
  pull_request:
    paths:
      - 'skills/property-deep-dive/countries/**/playbook.md'
      - 'scripts/audit-confidence.py'
      - 'scripts/primary-source-allowlist.txt'
      - 'config/_tiers.json'
      - '.github/workflows/confidence-audit.yml'
  push:
    branches: [main]
    paths:
      - 'skills/property-deep-dive/countries/**/playbook.md'
      - 'scripts/audit-confidence.py'
      - 'scripts/primary-source-allowlist.txt'
      - 'config/_tiers.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit Confidence vs primary-source URL count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Run audit (strict)
        run: |
          set -euo pipefail
          if [ ! -x scripts/audit-confidence.py ]; then
            chmod +x scripts/audit-confidence.py
          fi
          python3 scripts/audit-confidence.py
