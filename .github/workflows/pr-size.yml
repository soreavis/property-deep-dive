name: PR size labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Apply size/* label
        uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9  # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bands tuned for a markdown content repo:
          # - small factual / URL fixes are XS-S
          # - regulatory-watch + multi-playbook re-stamps are M
          # - new country playbooks (~400-500 lines) are L-XL
          xs_label: size/xs
          xs_max_size: 9
          s_label: size/s
          s_max_size: 49
          m_label: size/m
          m_max_size: 199
          l_label: size/l
          l_max_size: 599
          xl_label: size/xl
          fail_if_xl: false
          message_if_xl: |
            This PR is XL (>600 changed lines). For new country playbooks (~400-500 lines is the standard density), please confirm:

            - [ ] All 22 sections covered (or explicitly deferred with rationale)
            - [ ] Primary government sources cited for tax rates + risk registries
            - [ ] Status footer with `**Confidence**` + `**Last verified**` stamp
            - [ ] Country added to `SKILL.md` country support matrix

            Reviews of XL PRs typically take 1-2 weeks — see CONTRIBUTING.md § Review philosophy.
          # Generated files etc. that don't count toward size
          files_to_ignore: |
            "**/*.bak-*"
            "_local/**"
