name: URL liveness

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-urls:
    runs-on: ubuntu-latest
    # Was 30 min; bumped to 90 after the 2026-05-04 run timed out at exactly 30 min
    # following the 62 → 87 country sprint. Post-103 countries (Tier-1 + Tier-2 batches
    # PRs #111 + #113) the URL set is large enough that HEAD-checking every link
    # serially needs more headroom. Follow-up: parallelize the checker itself
    # (aiohttp / httpx with semaphore concurrency) — see ROADMAP "Coverage extensions".
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Extract URLs from all markdown files
        run: |
          mkdir -p _ci
          # Python extraction: like the old grep but
          #  (a) skips URLs immediately followed by `<` or `{` — these are template
          #      placeholders like `https://example.gov/path/<INSEE>` where the regex
          #      would otherwise truncate to `https://example.gov/path/` and 404
          #  (b) skips files that contain example/fixture URLs by design
          #      (test-fixtures.md = test data, not authoritative sources)
          python3 <<'EOF' > _ci/urls.txt
          import re
          from pathlib import Path

          URL_RE = re.compile(r"https?://[^\s<>\"`)\]]+")
          EXCLUDE_FILES = {"test-fixtures.md"}
          EXCLUDE_DIRS = {"node_modules", "_local"}

          seen = set()
          for path in Path(".").rglob("*.md"):
              if path.name in EXCLUDE_FILES:
                  continue
              if any(part in EXCLUDE_DIRS for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for m in URL_RE.finditer(text):
                  url = m.group(0).rstrip(".,;:)")
                  end = m.end()
                  # Skip if a placeholder follows (template URL)
                  if end < len(text) and text[end] in "<{":
                      continue
                  seen.add(url)
          for u in sorted(seen):
              print(u)
          EOF
          echo "Found $(wc -l < _ci/urls.txt) unique URLs (after template-skip + fixture-exclude)"

      - name: Check URL liveness
        run: |
          set +e
          : > _ci/results.tsv
          ok=0; redirect=0; bot=0; auth=0; dead=0; timeout=0; total=0
          while IFS= read -r url; do
            total=$((total+1))
            # HEAD first, fall back to GET for servers that reject HEAD
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 10 --head -L \
              -H "User-Agent: property-deep-dive-ci/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              "$url" 2>/dev/null)
            if [ -z "$code" ] || [ "$code" -ge 400 ] 2>/dev/null; then
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 15 -L \
                -H "User-Agent: property-deep-dive-ci/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
                "$url" 2>/dev/null)
            fi
            case "$code" in
              2*) class=LIVE; ok=$((ok+1)) ;;
              30[1278]) class=REDIRECT_LIVE; redirect=$((redirect+1)); ok=$((ok+1)) ;;
              401) class=AUTH_REQUIRED; auth=$((auth+1)) ;;
              403) class=BOT_BLOCKED; bot=$((bot+1)); ok=$((ok+1)) ;;
              404|410) class=DEAD; dead=$((dead+1)) ;;
              000|"") class=TIMEOUT; timeout=$((timeout+1)) ;;
              *) class="OTHER_$code"; dead=$((dead+1)) ;;
            esac
            printf '%s\t%s\t%s\n' "$code" "$class" "$url" >> _ci/results.tsv
            sleep 0.2
          done < _ci/urls.txt
          score=$(( ok * 100 / total ))
          echo "TOTAL=$total OK=$ok REDIRECT=$redirect BOT=$bot AUTH=$auth DEAD=$dead TIMEOUT=$timeout SCORE=$score"
          {
            echo "total=$total"
            echo "ok=$ok"
            echo "redirect=$redirect"
            echo "bot=$bot"
            echo "auth=$auth"
            echo "dead=$dead"
            echo "timeout=$timeout"
            echo "score=$score"
          } >> "$GITHUB_OUTPUT"
        id: check

      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: url-liveness-${{ github.run_id }}
          path: _ci/
          retention-days: 90

      - name: Open issue if score below threshold
        if: ${{ steps.check.outputs.score != '' && steps.check.outputs.score < 85 }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const score = '${{ steps.check.outputs.score }}';
            const total = '${{ steps.check.outputs.total }}';
            const dead = '${{ steps.check.outputs.dead }}';
            const timeout = '${{ steps.check.outputs.timeout }}';
            const tsv = fs.readFileSync('_ci/results.tsv', 'utf-8');
            const failures = tsv.split('\n')
              .filter(l => /\t(DEAD|TIMEOUT|OTHER_)/.test(l))
              .slice(0, 50)
              .join('\n') || '(none captured)';
            const body = [
              `URL liveness check on \`${context.sha.slice(0,7)}\` returned a score of **${score}%**`,
              `(threshold: 85%).`,
              ``,
              `**Counts**: total=${total}, dead=${dead}, timeout=${timeout}`,
              ``,
              `Top failing URLs (max 50):`,
              '```',
              failures,
              '```',
              ``,
              `Full results: see workflow artifact \`url-liveness-${{ github.run_id }}\`.`,
              ``,
              `Action: run \`/property-deep-dive --update --validate-only\` locally to confirm and replace.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `URL liveness degraded — score ${score}%`,
              body,
              labels: ['maintenance', 'url-liveness'],
            });
