name: URL liveness

# Re-enabled 2026-05-26 after the Python rewrite of the checker.
# Old serial-curl bash loop hit the 90-min cap at ~3,500 URLs and was paused
# 2026-05-08 (last green run 2026-04-27). The new aiohttp checker
# (scripts/url-liveness.py) processes ~6,600 URLs in ~17 min cold / ~5 min
# warm, respects robots.txt + Retry-After, throttles per-host (EUR-Lex 1@10s
# per Crawl-delay mandate; legifrance/CF-fronted gov 1@2s; gov-suffix 1@1s),
# detects Cloudflare challenges + 999 bot-blocks, caches LIVE/REDIRECT 30d
# (via workflow artifact, NOT actions/cache — the latter evicts at 7d) +
# random-refreshes 10% per run, and uses a 3-run rolling fail-streak before
# declaring a URL DEAD. See _local/wip-url-liveness-research/ for the full
# research file set + the consolidated decision brief.

on:
  schedule:
    # Monday 09:17 UTC. Off the top of the hour per GitHub's explicit guidance
    # that scheduled runs are most likely to be delayed or dropped at the
    # start of every hour under high load.
    - cron: '17 9 * * 1'
  workflow_dispatch:

# Prevent stacked runs if a previous one is still in-flight.
concurrency:
  group: url-liveness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read  # required to list/download prior artifacts (for cache restore)

jobs:
  check-urls:
    # Locked to main so workflow_dispatch from a feature branch can't run it.
    if: github.ref == 'refs/heads/main'
    # ubuntu-24.04 pinned (not -latest) for reproducible egress IP + TLS behaviour.
    runs-on: ubuntu-24.04
    # Hard ceiling above the local-dry-run baseline of ~28 min cold (1,708s
    # against the live 6,586-URL corpus on 2026-05-26) and expected ~5-8 min
    # warm. 60 min gives ~2× headroom for CI network variability + GH-runner
    # IP-specific upstream throttling.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install aiohttp
        run: python3 -m pip install --quiet 'aiohttp>=3.9,<4'

      - name: Run unit tests
        run: python3 scripts/url-liveness-test.py

      - name: Restore cache from latest prior artifact
        id: restore-cache
        # Soft-restore via `gh run download`. No third-party action — `gh` is
        # pre-installed on ubuntu-24.04 runners. First-run / no-prior-artifact
        # is non-fatal: the script handles an empty cache as a cold start.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _ci
          last_run=$(gh run list --workflow url-liveness.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "${last_run:-}" ]; then
            echo "Attempting cache restore from run $last_run …"
            if gh run download "$last_run" --name url-liveness-cache --dir _ci/ 2>/dev/null; then
              echo "Restored cache.json from run $last_run"
              ls -la _ci/
            else
              echo "No url-liveness-cache artifact on run $last_run — cold start"
            fi
            # Also restore the last-success timestamp so the report's "Previous
            # successful run" line is populated. Absent on below-threshold runs
            # (which write no last-success.txt) — non-fatal; the script falls back.
            if gh run download "$last_run" --name url-liveness-last-success --dir _ci/ 2>/dev/null; then
              echo "Restored last-success.txt from run $last_run"
            else
              echo "No url-liveness-last-success artifact on run $last_run"
            fi
          else
            echo "No prior successful run — cold start"
          fi

      - name: Run URL-liveness check
        id: check
        run: python3 scripts/url-liveness.py --ci --last-success-in _ci/last-success.txt

      - name: Upload cache artifact (90-day retention)
        # Always upload — even on score below threshold — so next run has the
        # latest fail-streak state.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: url-liveness-cache
          path: _ci/cache.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload last-success timestamp (90-day retention)
        # Written only when the score met threshold this run; absent otherwise,
        # so the next run's "Previous successful run" line stays meaningful.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: url-liveness-last-success
          path: _ci/last-success.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload full run artifact (90-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: url-liveness-${{ github.run_id }}
          path: _ci/
          retention-days: 90

      - name: Emit run summary
        if: always()
        run: |
          if [ -f _ci/report.md ]; then
            cat _ci/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update rolling issue if score below threshold
        if: ${{ steps.check.outputs.below_threshold == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('_ci/report.md', 'utf-8');
            const score = '${{ steps.check.outputs.score }}';
            const counted = '${{ steps.check.outputs.counted }}';
            const dead = '${{ steps.check.outputs.confirmed_dead }}';
            const threshold = '${{ steps.check.outputs.threshold }}';

            // Cap body to 60k chars (GH limit is 65,536); truncate from the middle of
            // confirmed-dead listing if needed. report.md is normally well under this.
            let body = report;
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n…truncated. See workflow artifact `url-liveness-${{ github.run_id }}`.';
            }

            const title = `URL liveness: ${score}% (${dead} confirmed-dead of ${counted})`;

            // Find existing open issue with the url-liveness label.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'url-liveness',
              per_page: 10,
            });

            if (issues.length > 0) {
              const existing = issues[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated rolling issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['maintenance', 'url-liveness'],
              });
              core.info(`Opened rolling issue #${created.number}`);
            }
