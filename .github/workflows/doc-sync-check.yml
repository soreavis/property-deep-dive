name: Doc sync check

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/property-deep-dive/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'config/_regions.json'
      - 'config/_visa-programs.json'
      - 'scripts/sync-docs.py'
      - '.github/workflows/doc-sync-check.yml'
  schedule:
    # Tuesday 09:00 UTC — separate day from url-liveness (Mon) and link-check (Fri)
    - cron: '0 9 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Auto-generated counts + blocks are in sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Run sync-docs.py --check
        id: sync
        run: |
          set -euo pipefail
          if [ ! -x scripts/sync-docs.py ]; then
            chmod +x scripts/sync-docs.py
          fi
          python3 scripts/sync-docs.py --check

      - name: Open issue on scheduled drift
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const title = '🔁 Doc-sync drift detected';
            const body = [
              `Scheduled \`sync-docs --check\` flagged drift on \`${context.sha.slice(0,7)}\`.`,
              ``,
              `**Action**: run \`./scripts/sync-docs.py\` locally and commit the result.`,
              ``,
              `Most likely cause: a recent merge added/removed a country, section flag, skills/property-deep-dive/shared/ file, or workflow without re-running sync-docs.`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'documentation', per_page: 10,
            });
            const pinned = open.find(i => i.title === title);
            const date = new Date().toISOString().slice(0, 10);

            if (pinned) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pinned.number, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pinned.number,
                body: `**${date}** — drift still present.\n\n<details><summary>Report</summary>\n\n${body}\n\n</details>`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['maintenance', 'documentation'],
              });
            }
