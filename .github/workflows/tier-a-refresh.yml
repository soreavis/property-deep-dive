name: Tier-A refresh reminder (quarterly)

on:
  schedule:
    # 1st of Jan/Apr/Jul/Oct at 09:00 UTC
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  refresh:
    uses: ./.github/workflows/_tier-refresh.yml
    with:
      tier_letter: A
      cadence_label: quarterly
      cadence_days: 90
      threshold_warn_days: 75
      include_regwatch_promotions: true
    permissions:
      contents: read
      issues: write
