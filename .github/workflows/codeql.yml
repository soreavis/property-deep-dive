name: CodeQL

# Static analysis on two languages:
#   - actions: scans every workflow YAML for injection patterns, risky
#     `${{}}` interpolations, and secret-leak vectors.
#   - python:  scans scripts/sync-docs.py (the doc-sync autogen) for code
#     injection, unsafe path traversal, hardcoded creds, etc.
# Bash scripts (scripts/pin-actions.sh) are not natively supported by CodeQL.

on:
  push:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.py'
  pull_request:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.py'
  schedule:
    # Wednesday 09:00 UTC — separate day from url-liveness (Mon), link-check (Fri), scorecard (Mon)
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
