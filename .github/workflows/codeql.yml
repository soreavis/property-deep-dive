name: CodeQL

# Static analysis on the `actions` language — scans every workflow YAML for
# injection patterns, risky `${{}}` interpolations, and secret-leak vectors.
# Python is NOT scanned because no .py files are committed (scripts/sync-docs.py
# is currently staged in _local/post-push-doc-sync/; once activated in a follow-
# up PR, add `python` back to the matrix below).
# Bash scripts (scripts/pin-actions.sh) are not natively supported by CodeQL.

on:
  push:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.py'
  pull_request:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.py'
  schedule:
    # Wednesday 09:00 UTC — separate day from url-liveness (Mon), link-check (Fri), scorecard (Mon)
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3
        with:
          category: "/language:${{ matrix.language }}"
