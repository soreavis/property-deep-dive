name: CodeQL

# Static analysis on two languages:
#   - actions: scans every workflow YAML for injection patterns, risky
#     `${{}}` interpolations, and secret-leak vectors.
#   - python:  scans scripts/sync-docs.py (the doc-sync autogen) for code
#     injection, unsafe path traversal, hardcoded creds, etc.
# Bash scripts (scripts/pin-actions.sh) are not natively supported by CodeQL.

on:
  push:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.py'
  pull_request:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.py'
  schedule:
    # Wednesday 09:00 UTC — separate day from url-liveness (Mon), link-check (Fri), scorecard (Mon)
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
