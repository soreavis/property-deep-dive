name: Auto-PR for permanent URL redirects

on:
  # SCHEDULE DISABLED — see docs/auto-pr-redirects-rationale below.
  # The original implementation re-scanned all 3,228 URLs in country playbooks
  # from scratch every Tuesday, which (a) duplicated url-liveness.yml's Monday
  # work, (b) had no per-request throttle, and (c) risked IP-banning the
  # GitHub Actions egress range from primary government sources. Re-enable
  # only after refactoring to consume url-liveness.yml's artifact (filter to
  # REDIRECT_LIVE only, ~50 URLs) and adding throttling.
  #
  # schedule:
  #   - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Detect permanent same-root redirects
        id: detect
        run: |
          set -euo pipefail
          mkdir -p _ci
          python3 scripts/find_redirects.py --max 20 --out _ci/redirects.tsv
          count=$(wc -l < _ci/redirects.tsv | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Detected $count redirect candidates"

      - name: Apply replacements
        if: steps.detect.outputs.count != '0'
        id: apply
        run: |
          set -euo pipefail
          # Replace URLs in-place; one URL may appear in multiple playbooks so do a global sweep.
          while IFS=$'\t' read -r old new pb; do
            [ -z "$old" ] && continue
            # Use perl for safe substitution (handles regex metacharacters in URLs predictably)
            perl -i -pe "s{\Q${old}\E}{${new}}g" skills/property-deep-dive/countries/*/playbook.md
          done < _ci/redirects.tsv

          # Generate a markdown table of changes for the PR body
          {
            echo "## Same-root permanent redirects detected"
            echo
            echo "Each row is a 301/308 redirect where the final URL stays on the same registered root domain — safe to auto-replace."
            echo
            echo "| Old URL | New URL | First playbook |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r old new pb; do
              [ -z "$old" ] && continue
              short_pb=$(echo "$pb" | sed 's|skills/property-deep-dive/countries/||')
              printf '| `%s` | `%s` | %s |\n' "$old" "$new" "$short_pb"
            done < _ci/redirects.tsv
            echo
            echo "**Excluded for human review**: cross-domain redirects (potential hijack / content-move / source-tier shift). See workflow logs for the skip list."
          } > _ci/redirects-pr-body.md

      - name: Open PR
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          date_tag=$(date -u +%Y%m%d)
          branch="auto/url-redirects-${date_tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add skills/property-deep-dive/countries/*/playbook.md
          if git diff --cached --quiet; then
            echo "No actual changes to commit — exiting"
            exit 0
          fi
          git commit -m "chore(urls): auto-replace ${{ steps.detect.outputs.count }} same-root permanent redirects

          Generated by .github/workflows/auto-pr-redirects.yml.
          Cross-domain redirects skipped — see workflow log."
          git push --set-upstream origin "$branch" --force-with-lease

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(urls): auto-replace ${{ steps.detect.outputs.count }} same-root permanent redirects" \
            --body-file _ci/redirects-pr-body.md \
            --label "maintenance,url-redirects,auto-generated"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: redirects-${{ github.run_id }}
          path: _ci/
          retention-days: 90
