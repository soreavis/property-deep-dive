name: Source-tier ratchet

# Project-wide primary-government source share — measured at HEAD vs main.
# Posts a sticky PR comment with the delta. Hard-fails the PR if the project
# share regresses by more than 5 percentage points (configurable below).
#
# Complements source-tier-audit.yml: that workflow scores PER changed playbook;
# this one scores the WHOLE repo and compares the proposed state to main.
#
# Why measure the project, not just the diff: a single playbook addition can
# pass the per-playbook bar (≥35% primary) yet still drag the project-wide
# share down because of its size. The ratchet catches that.

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/property-deep-dive/countries/**/playbook.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # Hard fail threshold (percentage points). Drop more than this and CI fails.
  HARD_DROP_PP: '5'
  # Soft warning (advisory comment only).
  SOFT_DROP_PP: '2'

jobs:
  ratchet:
    name: Compute project-wide primary share — HEAD vs main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute share at HEAD vs main
        id: ratchet
        env:
          HARD_DROP_PP: ${{ env.HARD_DROP_PP }}
          SOFT_DROP_PP: ${{ env.SOFT_DROP_PP }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > _ratchet.md
          import os, re, subprocess, sys
          from collections import defaultdict
          from urllib.parse import urlparse

          # Same domain classifier as source-tier-audit.yml — kept in sync by
          # convention. Tests-of-truth live in skills/property-deep-dive/shared/anti-hallucination.md.
          PRIMARY_GOV_PATTERNS = [
              r'\.gov(\.|$)', r'\.gouv\.', r'\.gob\.', r'\.gv\.at',
              r'gov\.uk$', r'gov\.ie$', r'gov\.gr$', r'gov\.cy$',
              r'\.europa\.eu$', r'ec\.europa\.eu', r'curia\.europa\.eu',
              r'ecb\.europa\.eu', r'eur-lex\.europa\.eu',
              r'cnb\.cz', r'bnb\.bg', r'banque-france\.fr',
              r'oenb\.at', r'snb\.ch', r'riksbank\.se', r'bportugal\.pt',
              r'norges-bank\.no', r'centralbank\.ie',
              r'\.fi$', r'\.is$', r'\.nl$', r'\.dk$', r'\.se$',
              r'cadastre\.gouv\.fr', r'agenziaentrate\.gov\.it',
              r'cuzk\.cz', r'skgeodesy\.sk', r'geoportail\.lu',
              r'kataster\.sk', r'katastr\.gov\.cz',
              r'maa-amet\.ee', r'tkgm\.gov\.tr',
          ]
          AGGREGATOR_DOMAINS = {
              'zillow.com', 'realtor.com', 'rightmove.co.uk', 'zoopla.co.uk',
              'immoscout24.de', 'immobilienscout24.de', 'is24.de',
              'idealista.com', 'idealista.it', 'idealista.pt', 'idealista.es',
              'funda.nl', 'sreality.cz', 'reality.cz', 'reality.sk',
              'immobiliare.it', 'casa.it', 'subito.it',
              'otodom.pl', 'gratka.pl', 'olx.pl',
              'daft.ie', 'myhome.ie',
              'safti.fr', 'seloger.com', 'leboncoin.fr', 'logic-immo.com', 'pap.fr',
              'spitogatos.gr', 'xe.gr',
              'hemnet.se', 'oikotie.fi', 'finn.no',
              'home.dk', 'boliga.dk', 'edc.dk',
              'nepremicnine.net', 'mojikvadrati.com',
              'realitycz.cz', 'bezrealitky.cz',
              'inmuebles24.com', 'inmuebles24.com.mx',
              'imovelweb.com.br', 'zonaprop.com.ar',
              'hepsiemlak.com', 'sahibinden.com',
          }
          def classify(url):
              try:
                  d = urlparse(url).netloc.lower()
              except Exception:
                  return 'other'
              if not d:
                  return 'other'
              if d.startswith('www.'):
                  d = d[4:]
              if d in AGGREGATOR_DOMAINS:
                  return 'aggregator'
              for pat in PRIMARY_GOV_PATTERNS:
                  if re.search(pat, d):
                      return 'primary'
              return 'other'

          URL_RE = re.compile(r'https?://[^\s)<>"\']+')

          def score_at(ref):
              # Returns (total_urls, primary_count, primary_share_pct) for all
              # skills/property-deep-dive/countries/*/playbook.md at the given git ref.
              ls = subprocess.run(
                  ['git', 'ls-tree', '-r', '--name-only', ref],
                  capture_output=True, text=True, check=True,
              )
              playbooks = [p for p in ls.stdout.splitlines()
                           if p.startswith('skills/property-deep-dive/countries/') and p.endswith('/playbook.md')]
              total = primary = 0
              for path in playbooks:
                  try:
                      content = subprocess.run(
                          ['git', 'show', f'{ref}:{path}'],
                          capture_output=True, text=True, check=True,
                      ).stdout
                  except subprocess.CalledProcessError:
                      continue
                  for u in URL_RE.findall(content):
                      u = u.rstrip('.,;:)')
                      total += 1
                      if classify(u) == 'primary':
                          primary += 1
              if total == 0:
                  return (0, 0, 0.0)
              return (total, primary, primary * 100.0 / total)

          # Resolve refs. GITHUB_BASE_REF is empty string (not unset) on
          # workflow_dispatch — `os.environ.get(..., 'main')` returns '' in
          # that case, so guard with `or 'main'`.
          base_ref = os.environ.get('GITHUB_BASE_REF') or 'main'
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', base_ref], check=False)
          base_sha = subprocess.run(
              ['git', 'rev-parse', f'origin/{base_ref}'],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          head_sha = subprocess.run(
              ['git', 'rev-parse', 'HEAD'],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          base_total, base_prim, base_share = score_at(base_sha)
          head_total, head_prim, head_share = score_at(head_sha)
          delta_pp = head_share - base_share

          hard = float(os.environ.get('HARD_DROP_PP', '5'))
          soft = float(os.environ.get('SOFT_DROP_PP', '2'))

          if delta_pp <= -hard:
              banner = f"## ⛔ Source-tier ratchet — hard regression\n\nThe project-wide primary-government URL share **dropped {abs(delta_pp):.2f} pp** (>{hard:.0f}pp threshold)."
              verdict = 'fail'
          elif delta_pp <= -soft:
              banner = f"## ⚠️ Source-tier ratchet — soft regression\n\nThe project-wide primary-government URL share **dropped {abs(delta_pp):.2f} pp** (>{soft:.0f}pp soft threshold; <{hard:.0f}pp hard fail)."
              verdict = 'warn'
          elif delta_pp >= +1:
              banner = f"## 📈 Source-tier ratchet — improvement\n\nThe project-wide primary-government URL share **rose {delta_pp:.2f} pp**."
              verdict = 'ok'
          else:
              banner = f"## ✅ Source-tier ratchet — within tolerance\n\nThe project-wide primary-government URL share moved **{delta_pp:+.2f} pp** (within ±{soft:.0f}pp soft band)."
              verdict = 'ok'

          print(banner)
          print()
          print('| Snapshot | Total URLs | Primary gov | Primary share |')
          print('|---|--:|--:|--:|')
          print(f"| `main`  ({base_sha[:7]}) | {base_total} | {base_prim} | {base_share:.2f}% |")
          print(f"| `HEAD`  ({head_sha[:7]}) | {head_total} | {head_prim} | {head_share:.2f}% |")
          print(f"| **Delta** |   |   | **{delta_pp:+.2f} pp** |")
          print()
          print(f"_Hard threshold: drop > {hard:.0f}pp fails this check. Soft threshold: drop > {soft:.0f}pp warns. See `skills/property-deep-dive/shared/anti-hallucination.md` § Source ranking._")

          # Persist verdict for the next step.
          with open('_verdict.txt', 'w') as f:
              f.write(verdict)
          PY
          verdict=$(cat _verdict.txt)
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

      - name: Sticky PR comment with delta
        if: github.event_name == 'pull_request'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('_ratchet.md')) return;
            const body = fs.readFileSync('_ratchet.md', 'utf-8');
            const tag = '<!-- source-tier-ratchet -->';
            const final = `${tag}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: final,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: final,
              });
            }

      - name: Fail if hard regression
        if: steps.ratchet.outputs.verdict == 'fail'
        run: |
          echo "::error::Source-tier ratchet hard regression — see PR comment for details."
          exit 1
