name: Match index audit

# Keeps config/_match-index.json (source of truth for the --match discovery mode)
# in sync with its inputs (shared/compare.md ranked lists + _visa-programs.json),
# and runs the render-script unit tests. Mirrors visa-programs-audit.yml.

on:
  pull_request:
    paths:
      - 'config/_match-index.json'
      - 'config/_match-extracted.json'
      - 'config/_visa-programs.json'
      - 'skills/property-deep-dive/shared/compare.md'
      - 'scripts/render-match-index.py'
      - 'scripts/render-match-index-test.py'
      - '.github/workflows/match-index-audit.yml'
  push:
    branches: [main]
    paths:
      - 'config/_match-index.json'
      - 'config/_match-extracted.json'
      - 'config/_visa-programs.json'
      - 'skills/property-deep-dive/shared/compare.md'
      - 'scripts/render-match-index.py'
      - 'scripts/render-match-index-test.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-check:
    name: _match-index.json ↔ compare.md render check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'

      - name: Render check (index is regenerable from its sources)
        run: python3 scripts/render-match-index.py --check

      - name: Unit tests
        run: python3 scripts/render-match-index-test.py
