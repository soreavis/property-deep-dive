name: End-of-month auto-tag (CalVer)

# Cron fires daily on day 28-31 at 23:30 UTC. The first step computes whether
# today is the actual last day of the month — only then does the workflow tag.
#
# Tag created: `YYYY.0M.0` for the current UTC month, IF:
#   1. No `YYYY.0M.0` tag exists yet for this month, AND
#   2. There are commits between `HEAD` and the latest CalVer tag.
#
# After tagging, the workflow explicitly dispatches sign-release.yml and
# release-notes.yml — required because tags pushed by the default GITHUB_TOKEN
# do NOT trigger downstream workflow runs (GitHub Actions safety rule).
#
# Manual override: workflow_dispatch lets a maintainer force a `.0` tag at any
# time (e.g., a mid-month release that supersedes the previous month's tag).

on:
  schedule:
    # Daily at 23:30 UTC on possible month-end days. The body filters the rest.
    - cron: '30 23 28-31 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force-tag even if not the last day of month
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  tag:
    name: Compute and push next CalVer .0 tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write  # to dispatch sign-release / release-notes
    steps:
      - name: Checkout (full history for tag walk)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm today is the last day of the month
        id: gate
        run: |
          set -euo pipefail
          force="${{ github.event.inputs.force }}"
          today=$(date -u +%d)
          last_day=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%d)
          echo "Today: $today  Last day of month: $last_day  Force: $force"
          if [ "$force" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Force-mode dispatch — bypassing last-day-of-month check."
            exit 0
          fi
          if [ "$today" != "$last_day" ]; then
            echo "::notice::Not the last day of month — skipping (will retry tomorrow)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next tag
        if: steps.gate.outputs.proceed == 'true'
        id: compute
        run: |
          set -euo pipefail
          year=$(date -u +%Y)
          month=$(date -u +%m)
          zero_tag="${year}.${month}.0"

          if git rev-parse -q --verify "refs/tags/${zero_tag}" >/dev/null; then
            echo "::notice::Tag ${zero_tag} already exists — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Latest CalVer tag (any) for commit-range comparison.
          latest_tag=$(git tag -l '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "$latest_tag" ]; then
            commits=$(git rev-list --count HEAD)
            since="repo init"
          else
            commits=$(git rev-list --count "${latest_tag}..HEAD")
            since="$latest_tag"
          fi

          echo "Commits since ${since}: ${commits}"
          if [ "$commits" -eq 0 ]; then
            echo "::notice::No commits since ${since} — nothing to tag."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=${zero_tag}"      >> "$GITHUB_OUTPUT"
          echo "commits=${commits}"   >> "$GITHUB_OUTPUT"
          echo "since=${since}"       >> "$GITHUB_OUTPUT"
          echo "proceed=true"         >> "$GITHUB_OUTPUT"

      - name: Guard — plugin.json must not be from a different month than the tag
        if: steps.compute.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
        # sign-release.yml builds the tarball FROM the tag, so whatever
        # plugin.json says at tag time is what ships. Nothing else in the release
        # path reads the manifest: this workflow derives the tag purely from the
        # calendar, and `Version month guard` only fires on PRs that *change* the
        # version — so a month could roll with no bump at all and the release
        # would carry a manifest from the previous month. Fail loudly here: a
        # missed tag is recoverable in minutes, a released tarball that disagrees
        # with its own version string is not.
        run: |
          set -euo pipefail
          manifest=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "plugin.json: ${manifest}    tag to cut: ${TAG}"

          if [ "${manifest%.*}" != "${TAG%.*}" ]; then
            echo "::error::plugin.json is ${manifest} but this run would tag ${TAG} — different CalVer month. The release tarball would ship a manifest from another month. Bump it first (python3 scripts/next-version.py --write), land that on main, then re-run this workflow with force=true."
            exit 1
          fi

          if [ "$manifest" != "$TAG" ]; then
            echo "::warning::plugin.json is ${manifest}, tagging ${TAG} — same month, different MICRO. Allowed (mid-month MICRO releases legitimately run ahead of the monthly .0), but check this is what you meant."
          else
            echo "::notice::plugin.json matches ${TAG}."
          fi

      - name: Push tag
        if: steps.compute.outputs.proceed == 'true'
        env:
          TAG: ${{ steps.compute.outputs.tag }}
          COMMITS: ${{ steps.compute.outputs.commits }}
          SINCE: ${{ steps.compute.outputs.since }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          msg="Auto-tagged ${TAG} — ${COMMITS} commit(s) since ${SINCE}"
          git tag -a "${TAG}" -m "${msg}"
          git push origin "${TAG}"
          echo "::notice::Pushed tag ${TAG}"

      - name: Dispatch sign-release.yml for the new tag
        if: steps.compute.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          # Tags pushed by GITHUB_TOKEN don't fire `push: tags` workflows.
          # Dispatch each downstream workflow explicitly with the new tag.
          gh workflow run sign-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "refs/tags/${TAG}" \
            -f tag="${TAG}"
          echo "Dispatched sign-release.yml for ${TAG}"

      - name: Dispatch release-notes.yml for the new tag
        if: steps.compute.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release-notes.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "refs/tags/${TAG}" \
            -f tag="${TAG}"
          echo "Dispatched release-notes.yml for ${TAG}"
