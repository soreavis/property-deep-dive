name: Source-tier audit (advisory)

# Counts primary-government vs aggregator URLs in changed country playbooks
# and posts a sticky comment on the PR. Advisory — does NOT fail CI.

on:
  pull_request:
    branches: [main]
    paths:
      - 'countries/**/playbook.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Compute primary-vs-aggregator share
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute source-tier breakdown
        id: tier
        run: |
          python3 - <<'PY' > _audit.md
          import re
          import subprocess
          from collections import defaultdict
          from urllib.parse import urlparse

          # Domain classifiers — extend as new patterns are seen in the wild.
          PRIMARY_GOV_PATTERNS = [
              r'\.gov(\.|$)', r'\.gouv\.', r'\.gob\.', r'\.gv\.at',
              r'gov\.uk$', r'gov\.ie$', r'gov\.gr$', r'gov\.cy$',
              r'\.europa\.eu$', r'ec\.europa\.eu', r'curia\.europa\.eu',
              r'ecb\.europa\.eu', r'eur-lex\.europa\.eu',
              r'cnb\.cz', r'bnb\.bg', r'banque-france\.fr',
              r'oenb\.at', r'snb\.ch', r'riksbank\.se', r'bportugal\.pt',
              r'norges-bank\.no', r'centralbank\.ie',
              r'\.fi$', r'\.is$', r'\.nl$', r'\.dk$', r'\.se$',
              # Cadastres / risk / tax authorities (sample)
              r'cadastre\.gouv\.fr', r'agenziaentrate\.gov\.it',
              r'cuzk\.cz', r'skgeodesy\.sk', r'geoportail\.lu',
              r'kataster\.sk', r'katastr\.gov\.cz',
              r'maa-amet\.ee', r'tkgm\.gov\.tr',
          ]
          AGGREGATOR_DOMAINS = {
              'zillow.com', 'realtor.com', 'rightmove.co.uk', 'zoopla.co.uk',
              'immoscout24.de', 'immobilienscout24.de', 'is24.de',
              'idealista.com', 'idealista.it', 'idealista.pt', 'idealista.es',
              'funda.nl', 'sreality.cz', 'reality.cz', 'reality.sk',
              'immobiliare.it', 'casa.it', 'subito.it',
              'otodom.pl', 'gratka.pl', 'olx.pl',
              'daft.ie', 'myhome.ie',
              'safti.fr', 'seloger.com', 'leboncoin.fr', 'logic-immo.com', 'pap.fr',
              'spitogatos.gr', 'xe.gr',
              'hemnet.se', 'oikotie.fi', 'finn.no',
              'home.dk', 'boliga.dk', 'edc.dk',
              'nepremicnine.net', 'mojikvadrati.com',
              'realitycz.cz', 'bezrealitky.cz',
              'inmuebles24.com', 'inmuebles24.com.mx',
              'imovelweb.com.br', 'zonaprop.com.ar',
              'hepsiemlak.com', 'sahibinden.com',
          }
          LISTING_TLDS = ('immobilien.', 'casas.', 'realestate.')

          def classify(url):
              try:
                  d = urlparse(url).netloc.lower()
              except Exception:
                  return 'other'
              if not d:
                  return 'other'
              # Strip leading www.
              d = d[4:] if d.startswith('www.') else d
              if d in AGGREGATOR_DOMAINS:
                  return 'aggregator'
              for pat in PRIMARY_GOV_PATTERNS:
                  if re.search(pat, d):
                      return 'primary'
              if any(d.startswith(t) for t in LISTING_TLDS):
                  return 'aggregator'
              return 'other'

          # Determine changed country playbooks
          base = "${{ github.base_ref }}"
          subprocess.run(['git', 'fetch', '--depth=1', 'origin', base], check=False)
          out = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=ACMR',
               f'origin/{base}...HEAD', '--', 'countries/*/playbook.md'],
              capture_output=True, text=True, check=False
          ).stdout.strip().splitlines()
          if not out:
              print('No country playbook changes in this PR — nothing to audit.')
              raise SystemExit(0)

          per_country = {}
          for path in out:
              try:
                  content = open(path, encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              urls = re.findall(r'https?://[^\s)<>"\']+', content)
              urls = [u.rstrip('.,;:)') for u in urls]
              tally = defaultdict(int)
              for u in urls:
                  tally[classify(u)] += 1
              per_country[path] = (sum(tally.values()), tally)

          if not per_country:
              raise SystemExit(0)

          print('## 📊 Source-tier audit (advisory)')
          print()
          print(f"Counts URLs in **{len(per_country)} changed country playbook(s)** by domain class.")
          print(f"Primary-government share is the reliability signal — aggregator-heavy playbooks lean on platforms that change often.")
          print()
          print('| Playbook | Total URLs | Primary gov | Aggregator | Other | Primary share |')
          print('|---|--:|--:|--:|--:|--:|')
          for path, (total, t) in sorted(per_country.items()):
              prim = t.get('primary', 0)
              agg  = t.get('aggregator', 0)
              oth  = t.get('other', 0)
              share = (prim * 100 // total) if total else 0
              flag = '🟢' if share >= 60 else '🟡' if share >= 35 else '🟠'
              print(f"| `{path}` | {total} | {prim} | {agg} | {oth} | {flag} {share}% |")
          print()
          print('_Bands: 🟢 ≥60% primary · 🟡 35-59% · 🟠 <35%. Advisory only — does not block merge._')
          print()
          print('See [`shared/anti-hallucination.md`](../blob/main/shared/anti-hallucination.md) § Source ranking for the full hierarchy.')
          PY

      - name: Sticky comment on PR
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('_audit.md') || fs.statSync('_audit.md').size === 0) return;
            const body = fs.readFileSync('_audit.md', 'utf-8');
            const tag = '<!-- source-tier-audit -->';
            const final = `${tag}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: final,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: final,
              });
            }
