name: Health report (decay matrix)

on:
  schedule:
    # First day of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  decay-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute decay matrix
        id: matrix
        run: |
          set -euo pipefail
          today_epoch=$(date +%s)
          out=_ci/decay-matrix.md
          mkdir -p _ci

          # Build iso2 → cadence-tier map from config/_tiers.json
          declare -A cadence_tier
          declare -A cadence_days
          while IFS=$'\t' read -r tier code; do
            cadence_tier[$code]=$tier
            case "$tier" in
              A) cadence_days[$code]=90 ;;
              B) cadence_days[$code]=180 ;;
              C) cadence_days[$code]=365 ;;
            esac
          done < <(python3 -c "import json; print('\n'.join(f'{t}\t{c}' for t, info in json.load(open('config/_tiers.json'))['tiers'].items() for c in info['codes']))")

          {
            echo "# Decay Health Report — $(date -u +%Y-%m-%d)"
            echo
            echo "Auto-downgrade ladder: HIGH → MEDIUM at 6mo, → LOW at 12mo, → STALE at 18mo."
            echo "Cadence tier: A (90d) / B (180d) / C (365d) per \`config/_tiers.json\`. Off-cadence = days old ≥ tier cadence."
            echo
            echo "| Country | Cadence | Stamped (\`as of\`) | Days old | Decay tier | Off-cadence? |"
            echo "|---|---|---|---:|---|---|"
          } > "$out"

          stale_count=0
          low_count=0
          medium_count=0
          high_count=0
          off_cadence_a=0
          off_cadence_b=0
          off_cadence_c=0
          decay_warn_count=0
          cadence_warn_count=0
          warn_lines=""

          for playbook in skills/property-deep-dive/countries/*/playbook.md; do
            iso2=$(basename "$(dirname "$playbook")")
            ctier=${cadence_tier[$iso2]:-?}
            ccap=${cadence_days[$iso2]:-0}
            # Extract first stamp matching either "as of YYYY-MM-DD" or "**Last verified**: YYYY-MM-DD".
            # `|| true` swallows grep's exit-1 (no match) so `set -e + pipefail` doesn't abort the whole job
            # for a single missing-stamp playbook — that case is handled below as tier=UNKNOWN.
            stamped=$(grep -oE '(as of +|\*\*Last verified\*\*: *)[0-9]{4}-[0-9]{2}-[0-9]{2}' "$playbook" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
            off="—"
            if [ -z "$stamped" ]; then
              stamped="(none)"
              days="?"
              tier="UNKNOWN"
            else
              stamped_epoch=$(date -d "$stamped" +%s 2>/dev/null || gdate -d "$stamped" +%s 2>/dev/null || echo 0)
              days=$(( (today_epoch - stamped_epoch) / 86400 ))
              if   [ "$days" -lt 180 ]; then tier="HIGH"; high_count=$((high_count+1))
              elif [ "$days" -lt 360 ]; then tier="MEDIUM"; medium_count=$((medium_count+1))
              elif [ "$days" -lt 540 ]; then tier="LOW"; low_count=$((low_count+1))
              else tier="STALE"; stale_count=$((stale_count+1))
              fi
              if [ "$ccap" -gt 0 ] && [ "$days" -ge "$ccap" ]; then
                off="🟠 yes (>${ccap}d)"
                case "$ctier" in
                  A) off_cadence_a=$((off_cadence_a+1)) ;;
                  B) off_cadence_b=$((off_cadence_b+1)) ;;
                  C) off_cadence_c=$((off_cadence_c+1)) ;;
                esac
              else
                off="🟢 no"
                # Cadence early warning: within 30d of cap, not yet over
                if [ "$ccap" -gt 0 ] && [ "$days" -ge $((ccap - 30)) ]; then
                  remaining=$((ccap - days))
                  warn_lines="${warn_lines}- 🟡 ${iso2} (Tier-${ctier}, ${remaining}d until off-cadence)"$'\n'
                  cadence_warn_count=$((cadence_warn_count+1))
                fi
              fi
              # Decay early warning: within 30d of next decay step (180/360/540)
              decay_warn=""
              if [ "$days" -lt 180 ] && [ "$days" -ge 150 ]; then
                decay_warn="HIGH→MEDIUM in $((180 - days))d"
              elif [ "$days" -lt 360 ] && [ "$days" -ge 330 ]; then
                decay_warn="MEDIUM→LOW in $((360 - days))d"
              elif [ "$days" -lt 540 ] && [ "$days" -ge 510 ]; then
                decay_warn="LOW→STALE in $((540 - days))d"
              fi
              if [ -n "$decay_warn" ]; then
                warn_lines="${warn_lines}- ⏱️ ${iso2}: ${decay_warn}"$'\n'
                decay_warn_count=$((decay_warn_count+1))
              fi
            fi
            printf '| %s | %s | %s | %s | %s | %s |\n' "$iso2" "$ctier" "$stamped" "$days" "$tier" "$off" >> "$out"
          done

          {
            echo
            echo "## Decay summary"
            echo
            echo "- 🟢 HIGH: $high_count"
            echo "- 🟡 MEDIUM: $medium_count"
            echo "- 🟠 LOW: $low_count"
            echo "- 🔴 STALE: $stale_count"
            echo
            echo "## Off-cadence summary"
            echo
            echo "Countries past their tier's refresh window:"
            echo "- Tier-A (90d): $off_cadence_a"
            echo "- Tier-B (180d): $off_cadence_b"
            echo "- Tier-C (365d): $off_cadence_c"
            echo
            echo "## Early warning — decaying or due-soon within 30 days"
            echo
            if [ "$decay_warn_count" -eq 0 ] && [ "$cadence_warn_count" -eq 0 ]; then
              echo "_None within the 30-day window. Next refresh planning can wait._"
            else
              echo "Plan refresh now to avoid surprise decay flags or off-cadence alarms."
              echo
              printf '%s' "$warn_lines"
            fi
            echo
            echo "## Action queue"
            echo
            echo "1. Run \`/property-deep-dive --update --tier=A\` if any Tier-A is off-cadence."
            echo "2. Run \`/property-deep-dive --update --refresh-only --country=<iso2>\` for any STALE or LOW country."
            echo "3. Cross-reference \`skills/property-deep-dive/shared/regulatory-watch.md\` — Tier 1/2 entries since the last \`as of\` date force STALE regardless of calendar age."
          } >> "$out"

          {
            echo "stale_count=$stale_count"
            echo "low_count=$low_count"
            echo "medium_count=$medium_count"
            echo "high_count=$high_count"
            echo "off_cadence_a=$off_cadence_a"
            echo "off_cadence_b=$off_cadence_b"
            echo "off_cadence_c=$off_cadence_c"
            echo "decay_warn_count=$decay_warn_count"
            echo "cadence_warn_count=$cadence_warn_count"
          } >> "$GITHUB_OUTPUT"

      - name: Upload decay matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: decay-matrix-${{ github.run_id }}
          path: _ci/decay-matrix.md
          retention-days: 365

      - name: Find or create pinned health-report issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          STALE: ${{ steps.matrix.outputs.stale_count }}
          LOW: ${{ steps.matrix.outputs.low_count }}
          MEDIUM: ${{ steps.matrix.outputs.medium_count }}
          HIGH: ${{ steps.matrix.outputs.high_count }}
          OFF_A: ${{ steps.matrix.outputs.off_cadence_a }}
          OFF_B: ${{ steps.matrix.outputs.off_cadence_b }}
          OFF_C: ${{ steps.matrix.outputs.off_cadence_c }}
          DECAY_WARN: ${{ steps.matrix.outputs.decay_warn_count }}
          CADENCE_WARN: ${{ steps.matrix.outputs.cadence_warn_count }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('_ci/decay-matrix.md', 'utf-8');
            const title = '📊 Health Report — Country Decay Matrix';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-report',
              per_page: 10,
            });
            const pinned = issues.data.find(i => i.title === title);

            const date = new Date().toISOString().slice(0, 10);
            const summary = `**${date}** — HIGH: ${process.env.HIGH} · MEDIUM: ${process.env.MEDIUM} · LOW: ${process.env.LOW} · STALE: ${process.env.STALE} · off-cadence A/B/C: ${process.env.OFF_A}/${process.env.OFF_B}/${process.env.OFF_C} · early-warning ⏱️${process.env.DECAY_WARN} 🟡${process.env.CADENCE_WARN}`;

            if (pinned) {
              // Update the body so it always reflects the latest matrix
              // (otherwise readers visiting the issue cold see the frozen
              // first-run snapshot — bug surfaced 2026-05-26).
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pinned.number,
                body: `${summary}\n\n${body}`,
              });
              // Append a comment as the month-over-month history log.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pinned.number,
                body: `${summary}\n\n<details><summary>Full matrix</summary>\n\n${body}\n\n</details>`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${summary}\n\n${body}`,
                labels: ['maintenance', 'health-report'],
              });
            }
