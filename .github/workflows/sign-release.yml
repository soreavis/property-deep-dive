name: Sign release

on:
  push:
    tags:
      # CalVer YYYY.0M.MICRO — same pattern as release-notes.yml
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to sign (e.g. 2026.04.0). Required when dispatched manually.
        required: true

# id-token: write enables sigstore keyless signing via OIDC (only the sign job needs it).
permissions:
  contents: read

jobs:
  sign:
    name: Sigstore-sign release tarball + SBOM-style file list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout (full history for archive)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF##*/}"
          fi
          # Defensive: must be a CalVer tag.
          if ! printf '%s' "$tag" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "::error::Resolved tag '$tag' is not a CalVer YYYY.0M.MICRO."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release tarball + manifest
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # Repo snapshot at the tag, excluding _local/ and CI artifacts
          git archive --format=tar.gz --prefix="property-deep-dive-${tag}/" \
            -o "property-deep-dive-${tag}.tar.gz" "$tag"

          # Manifest: every file in the archive with sha256 — useful for content provenance
          tar -tzf "property-deep-dive-${tag}.tar.gz" | sort > "property-deep-dive-${tag}.manifest.txt"
          sha256sum "property-deep-dive-${tag}.tar.gz" > "property-deep-dive-${tag}.tar.gz.sha256"

      - name: Sign tarball (keyless via GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          cosign sign-blob --yes \
            --bundle "property-deep-dive-${tag}.tar.gz.sigstore" \
            "property-deep-dive-${tag}.tar.gz"

      - name: Compute base64 hashes for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # SLSA generator expects "<sha256>  <filename>" lines, base64-encoded.
          # We attest the tarball + manifest — the .sha256 + .sigstore files are
          # signature material themselves and don't need provenance.
          {
            sha256sum "property-deep-dive-${tag}.tar.gz"
            sha256sum "property-deep-dive-${tag}.manifest.txt"
          } | base64 -w0 > _hashes.b64
          echo "hashes=$(cat _hashes.b64)" >> "$GITHUB_OUTPUT"

      - name: Wait for release-notes.yml to create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          for i in 1 2 3 4 5 6; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag is visible."
              exit 0
            fi
            echo "Release $tag not yet visible — waiting (attempt $i/6)…"
            sleep 10
          done
          echo "::warning::Release not visible after 60s — softprops/action-gh-release will create it."

      - name: Upload artifacts to GitHub Release
        # softprops/action-gh-release is OpenSSF Scorecard-recognised as a packaging
        # publisher (Packaging check). Functionally equivalent to `gh release upload`
        # but better release-management UX (idempotent, attaches to existing release).
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            property-deep-dive-${{ steps.tag.outputs.tag }}.tar.gz
            property-deep-dive-${{ steps.tag.outputs.tag }}.tar.gz.sha256
            property-deep-dive-${{ steps.tag.outputs.tag }}.tar.gz.sigstore
            property-deep-dive-${{ steps.tag.outputs.tag }}.manifest.txt

      - name: Append verification instructions to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' || echo "")

          {
            echo "$existing"
            echo
            echo "---"
            echo
            echo "## 🔏 Verifying this release"
            echo
            echo "This release ships **two independent attestations**:"
            echo
            echo "1. **Sigstore keyless signature** — proves the tarball was signed by the GitHub Actions OIDC identity for \`${GITHUB_REPOSITORY}\` at this tag."
            echo "2. **SLSA Level 3 provenance** — generated by \`slsa-framework/slsa-github-generator\` (separate workflow, independent trust chain), proves what built the artifact and from which source revision."
            echo
            echo "### 1) Verify with cosign (sigstore)"
            echo
            echo '```bash'
            echo "# Download tarball + sigstore bundle"
            echo "gh release download $tag --repo ${GITHUB_REPOSITORY} \\"
            echo "  --pattern 'property-deep-dive-${tag}.tar.gz' \\"
            echo "  --pattern 'property-deep-dive-${tag}.tar.gz.sigstore'"
            echo
            echo "cosign verify-blob \\"
            echo "  --bundle property-deep-dive-${tag}.tar.gz.sigstore \\"
            echo "  --certificate-identity-regexp 'https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/sign-release\\.yml@.*' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  property-deep-dive-${tag}.tar.gz"
            echo '```'
            echo
            echo "**Expected output**: \`Verified OK\`."
            echo
            echo "### 2) Verify with slsa-verifier (SLSA L3)"
            echo
            echo '```bash'
            echo "# Install slsa-verifier (one-off)"
            echo "go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@latest"
            echo
            echo "# Download the SLSA provenance file (multiple.intoto.jsonl)"
            echo "gh release download $tag --repo ${GITHUB_REPOSITORY} \\"
            echo "  --pattern 'multiple.intoto.jsonl' \\"
            echo "  --pattern 'property-deep-dive-${tag}.tar.gz'"
            echo
            echo "slsa-verifier verify-artifact \\"
            echo "  --provenance-path multiple.intoto.jsonl \\"
            echo "  --source-uri github.com/${GITHUB_REPOSITORY} \\"
            echo "  --source-tag $tag \\"
            echo "  property-deep-dive-${tag}.tar.gz"
            echo '```'
            echo
            echo "**Expected output**: \`PASSED: SLSA verification passed\`."
            echo
            echo "### Why two attestations?"
            echo
            echo "Sigstore proves *who signed* (this repo's GitHub Actions identity). SLSA proves *how it was built* (clean checkout, no tampering, hermetic build job). Together they're stronger than either alone — a compromise of one doesn't bypass the other."
          } > _new_body.md

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file _new_body.md

  provenance:
    name: Generate SLSA Level 3 provenance
    needs: sign
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA reusable workflows MUST be pinned to a tag (not SHA): the trust chain
    # requires that builders be referenced by an immutable, signed tag. See:
    # https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md#referencing-the-slsa-generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sign.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.sign.outputs.tag }}
