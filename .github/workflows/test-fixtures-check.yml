name: Test-fixtures liveness

on:
  schedule:
    # First Wednesday of the month, 09:00 UTC (3 days after monthly health-report)
    - cron: '0 9 1-7 * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Verify shared/test-fixtures.md listings still resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Extract listing URLs from test-fixtures.md
        run: |
          set -euo pipefail
          mkdir -p _ci
          if [ ! -f shared/test-fixtures.md ]; then
            echo "test-fixtures.md not found — skipping."
            exit 0
          fi

          # Pull listing URLs (heuristic: any http(s) URL inside test-fixtures.md)
          grep -oE 'https?://[^[:space:]<>")`]+' shared/test-fixtures.md \
            | sed 's/[.,;:)]*$//' \
            | sort -u \
            > _ci/fixtures.txt
          echo "Found $(wc -l < _ci/fixtures.txt) fixture URLs"

      - name: Check fixture liveness
        id: check
        run: |
          set +e
          : > _ci/results.tsv
          ok=0; bot=0; dead=0; total=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            total=$((total+1))
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 12 --head -L \
              -H "User-Agent: property-deep-dive-fixtures/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              "$url" 2>/dev/null)
            if [ -z "$code" ] || [ "$code" -ge 400 ] 2>/dev/null; then
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 18 -L \
                -H "User-Agent: property-deep-dive-fixtures/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
                "$url" 2>/dev/null)
            fi
            case "$code" in
              2*|30[1278]) class=LIVE; ok=$((ok+1)) ;;
              403)         class=BOT_BLOCKED; bot=$((bot+1)); ok=$((ok+1)) ;;
              404|410)     class=DEAD; dead=$((dead+1)) ;;
              *)           class="OTHER_$code"; dead=$((dead+1)) ;;
            esac
            printf '%s\t%s\t%s\n' "$code" "$class" "$url" >> _ci/results.tsv
            sleep 0.3
          done < _ci/fixtures.txt

          [ "$total" -eq 0 ] && total=1
          score=$(( ok * 100 / total ))
          echo "TOTAL=$total LIVE=$ok BOT=$bot DEAD=$dead SCORE=$score"
          {
            echo "total=$total"
            echo "ok=$ok"
            echo "bot=$bot"
            echo "dead=$dead"
            echo "score=$score"
          } >> "$GITHUB_OUTPUT"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-fixtures-${{ github.run_id }}
          path: _ci/
          retention-days: 90

      - name: Open issue if fixture liveness drops
        if: ${{ steps.check.outputs.score != '' && steps.check.outputs.score < 75 }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const tsv = fs.readFileSync('_ci/results.tsv', 'utf-8');
            const failures = tsv.split('\n')
              .filter(l => /\t(DEAD|OTHER_)/.test(l))
              .slice(0, 50)
              .join('\n') || '(none)';
            const body = [
              `Test-fixtures liveness on \`${context.sha.slice(0,7)}\` is **${{ steps.check.outputs.score }}%**`,
              `(threshold: 75% — listings rotate IDs more aggressively than gov portals).`,
              ``,
              `**Counts**: total=${{ steps.check.outputs.total }}, live=${{ steps.check.outputs.ok }}, bot-blocked=${{ steps.check.outputs.bot }}, dead=${{ steps.check.outputs.dead }}`,
              ``,
              `Top failing fixtures:`,
              '```',
              failures,
              '```',
              ``,
              `Action: open \`shared/test-fixtures.md\` and replace dead listings with current ones for the affected countries.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test-fixtures liveness degraded — ${{ steps.check.outputs.score }}%`,
              body,
              labels: ['maintenance', 'url-liveness'],
            });
