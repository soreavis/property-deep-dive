name: Generate release notes

on:
  push:
    tags:
      # CalVer YYYY.0M.MICRO — e.g. 2026.04.0, 2026.04.1, 2026.05.0
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to generate notes for (e.g. 2026.04.0)
        required: true

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve tag and previous tag
        id: tags
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF##*/}"
          fi
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag prev=$prev"

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.tag }}"
          prev="${{ steps.tags.outputs.prev }}"

          if [ -z "$prev" ]; then
            range="$tag"
            scope="initial public release"
            git ls-tree -r --name-only "$tag" -- '*.md' > _changed.txt
          else
            range="$prev..$tag"
            scope="changes since $prev"
            git diff --name-only "$prev" "$tag" -- '*.md' > _changed.txt
          fi

          echo "Range: $range — $(wc -l < _changed.txt) markdown files"

          # Bucket by directory / file
          : > _bucket_countries.txt
          : > _bucket_shared.txt
          : > _bucket_regwatch.txt
          : > _bucket_visa.txt
          : > _bucket_router.txt
          : > _bucket_meta.txt
          : > _bucket_other.txt

          while IFS= read -r f; do
            case "$f" in
              skills/property-deep-dive/countries/*/playbook.md)
                iso2=$(echo "$f" | awk -F/ '{print $4}')
                echo "- 🇨${iso2^^} $f" >> _bucket_countries.txt
                ;;
              skills/property-deep-dive/shared/regulatory-watch.md)
                echo "- $f" >> _bucket_regwatch.txt
                ;;
              skills/property-deep-dive/shared/visa-programs.md)
                echo "- $f" >> _bucket_visa.txt
                ;;
              skills/property-deep-dive/SKILL.md|SKILL.md)
                echo "- $f (master router)" >> _bucket_router.txt
                ;;
              skills/property-deep-dive/shared/*)
                echo "- $f" >> _bucket_shared.txt
                ;;
              README.md|CONTRIBUTING.md|DISCLAIMER.md|CODE_OF_CONDUCT.md|SECURITY.md|CHANGELOG.md|CLAUDE.md)
                echo "- $f" >> _bucket_meta.txt
                ;;
              *)
                echo "- $f" >> _bucket_other.txt
                ;;
            esac
          done < _changed.txt

          # Build release body
          {
            echo "## $tag — $scope"
            echo
            if [ -n "$prev" ]; then
              echo "Range: \`$prev\` → \`$tag\` (CalVer YYYY.0M.MICRO)"
              echo
            fi

            if [ -s _bucket_regwatch.txt ]; then
              echo "### 🚨 Regulatory-watch updates"
              echo
              cat _bucket_regwatch.txt
              echo
            fi

            if [ -s _bucket_visa.txt ]; then
              echo "### 🛂 Visa programmes"
              echo
              cat _bucket_visa.txt
              echo
            fi

            if [ -s _bucket_countries.txt ]; then
              echo "### 🌍 Country playbooks"
              echo
              cat _bucket_countries.txt
              echo
            fi

            if [ -s _bucket_router.txt ]; then
              echo "### 🧭 Router"
              echo
              cat _bucket_router.txt
              echo
            fi

            if [ -s _bucket_shared.txt ]; then
              echo "### 🛠 Shared sections / tooling"
              echo
              cat _bucket_shared.txt
              echo
            fi

            if [ -s _bucket_meta.txt ]; then
              echo "### 📄 Documentation / governance"
              echo
              cat _bucket_meta.txt
              echo
            fi

            if [ -s _bucket_other.txt ]; then
              echo "### Other"
              echo
              cat _bucket_other.txt
              echo
            fi

            echo
            echo "---"
            echo
            if [ -n "$prev" ]; then
              echo "**Compare**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else
              echo "**Initial public release** — see CHANGELOG.md § [${tag#v}] for the full feature list."
            fi
          } > _release_body.md

          echo "body_path=_release_body.md" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists — updating notes"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --notes-file "${{ steps.classify.outputs.body_path }}"
          else
            echo "Creating release $tag"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file "${{ steps.classify.outputs.body_path }}"
          fi
