name: Feed watcher (regulatory signals)

on:
  schedule:
    # Daily at 09:00 UTC — was every 6h until 2026-05-01 (cut to save GHA-minutes;
    # regulatory feeds don't move fast enough to need 4× daily polling).
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Property-relevant keywords (case-insensitive, word-anchored). Tune over time.
      KEYWORDS: 'property|real estate|housing|EPBD|short-let|short term rental|cadastre|land registry|stamp duty|transfer tax|capital gains|golden visa|residency|citizenship|mortgage|notary|landlord|tenancy|rental cap'
      # `property` alone matches "intellectual property" across the EU press feeds.
      EXCLUDE: 'intellectual property'
      # Feeds hold 10-25 items and are polled daily; without this window every poll
      # re-reports the same items and opens a duplicate issue.
      WINDOW_DAYS: '3'
      # `Mozilla/5.0 (compatible; …)`, not a bare product token: EU hosts increasingly
      # sit behind WAFs that challenge an unrecognised UA (europarl.europa.eu answers
      # `property-deep-dive-ci/1.0`, `somebot/1.0` and even a bare `Mozilla/5.0` with
      # HTTP 202 + an empty body — verified 2026-07-24, 3 reps each). The product
      # token and contact URL stay, so this identifies the CI honestly rather than
      # impersonating a browser. It is NOT a bypass: that host challenges GitHub
      # runner IPs whatever the UA, which is why the EP feeds below now come from
      # the EP's Open Data host instead.
      FEED_UA: 'Mozilla/5.0 (compatible; property-deep-dive-ci/1.0; +https://github.com/${{ github.repository }})'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Unit tests — feed filter
        run: python3 scripts/filter-feeds-test.py

      - name: Fetch and filter regulatory feeds
        id: feeds
        run: |
          set -euo pipefail
          mkdir -p _ci
          : > _ci/matches.txt
          : > _ci/dead-feeds.txt

          ok=0
          total=0

          fetch_and_filter() {
            local name="$1" url="$2"
            # Separate statement: bash expands every word of `local` before it
            # assigns any, so `xml="_ci/${name}.xml"` here would read an unbound
            # `name` and abort under `set -u`.
            local xml="_ci/${name}.xml"
            local hdr="_ci/${name}.headers"
            local code waf
            total=$((total + 1))

            # 45 s, not 20: the Open Data Atom feeds are 250-280 KB and answer in
            # 4-10 s from a cold host — 20 s left no headroom under load.
            # Atom leads the Accept list: the Open Data API content-negotiates
            # strictly and 406s whenever `application/rss+xml` outranks atom, while
            # the two RSS sources ignore the header entirely.
            if ! code=$(curl -fsSL --max-time 45 --retry 3 --retry-delay 2 \
                 -H "User-Agent: ${FEED_UA}" \
                 -H 'Accept: application/atom+xml, application/rss+xml;q=0.9, application/xml;q=0.8, */*;q=0.7' \
                 -D "$hdr" -w '%{http_code}' "$url" -o "$xml"); then
              echo "::warning title=Feed unreachable::${name} could not be fetched — ${url}"
              echo "- \`${name}\` — unreachable (<${url}>)" >> _ci/dead-feeds.txt
              return 0
            fi

            # A bot wall is not a retired feed, and must not be reported as one.
            # AWS WAF answers a challenge with HTTP 202 + an empty body, which is a
            # 2xx — `curl -f` passes it through and the parser then reports "no
            # element found", indistinguishable from a genuinely dead source. That
            # misdiagnosis is what the 2026-07-24 run produced for both EP feeds.
            if [ ! -s "$xml" ]; then
              waf=$(grep -i '^x-amzn-waf-action:' "$hdr" | tail -1 | tr -d '\r' | cut -d: -f2- | tr -d ' ') || true
              echo "::warning title=Feed blocked::${name} returned an empty body (HTTP ${code}${waf:+, x-amzn-waf-action: ${waf}}) — bot wall, not a retired feed — ${url}"
              echo "- \`${name}\` — empty body (HTTP ${code}${waf:+, \`x-amzn-waf-action: ${waf}\`}) — bot wall, not a retired feed; fix the User-Agent before touching the URL (<${url}>)" >> _ci/dead-feeds.txt
              return 0
            fi

            # Exit 2 = well-formed but zero items, i.e. a retired feed still
            # serving HTTP 200 (EUR-Lex did exactly this, undetected, for months).
            if ! python3 scripts/filter-feeds.py \
                 --name "$name" --path "$xml" \
                 --keywords "$KEYWORDS" --exclude "$EXCLUDE" --window-days "$WINDOW_DAYS" \
                 >> _ci/matches.txt; then
              echo "::warning title=Feed unusable::${name} returned no parseable items — retired or soft-404 — ${url}"
              echo "- \`${name}\` — no parseable items (<${url}>)" >> _ci/dead-feeds.txt
              return 0
            fi

            ok=$((ok + 1))
          }

          # Curated primary-source feeds. EC-Press + CJEU-PR verified live 2026-07-09;
          # the two EP slots re-pointed and all four re-verified from a GitHub runner
          # 2026-07-24.
          #
          # Re-pointed 2026-07-24 — www.europarl.europa.eu moved behind an AWS WAF that
          # challenges every GitHub-runner IP (HTTP 202 + empty body) whatever the UA,
          # so its RSS is unreadable from CI although both feeds are live in a browser.
          # The EP's Open Data host serves the same signal as Atom and answers runners
          # normally (English titles, ISO-8601 <updated>, ~500 and ~410 entries):
          #   EP-Adopted    rss/doc/texts-adopted/en.xml  → api/v2/adopted-texts/feed
          #   EP-Press      rss/doc/press-releases/en.xml → no Open Data equivalent;
          #                 the slot now carries the legislative pipeline (procedures),
          #                 which surfaces a reform before adoption rather than after.
          #
          # Removed 2026-07-09, all three silently dead:
          #   EU-OJ-L   eur-lex.europa.eu/EN/display-feed.rss — HTTP 200 + "The RSS feed
          #             doesn't exist or is no longer valid"; EUR-Lex now gates RSS behind
          #             a signed-in account. EP-Adopted covers the legislation signal.
          #   ECJ-PR    curia.europa.eu/.../2024-01/cp_en.xml — HTTP 404; the Court moved
          #             its feed to site/rss.jsp (see CJEU-PR below).
          #   OECD-Tax  oecd.org/tax/feed/ — HTTP 403; oecd.org blocks non-browser clients
          #             host-wide (the bare homepage 403s too), so no path is CI-reachable.
          fetch_and_filter "EC-Press"      "https://ec.europa.eu/commission/presscorner/api/rss?language=en"
          fetch_and_filter "EP-Adopted"    "https://data.europarl.europa.eu/api/v2/adopted-texts/feed"
          fetch_and_filter "EP-Procedures" "https://data.europarl.europa.eu/api/v2/procedures/feed"
          fetch_and_filter "CJEU-PR"       "https://curia.europa.eu/site/rss.jsp?lang=en&secondLang=fr"

          {
            echo "### Feed watcher — ${ok}/${total} feeds healthy"
            [ -s _ci/dead-feeds.txt ] && { echo; echo "**Dead feeds:**"; cat _ci/dead-feeds.txt; }
          } >> "$GITHUB_STEP_SUMMARY" || true

          if [ -s _ci/matches.txt ]; then
            echo "found_matches=true" >> "$GITHUB_OUTPUT"
            head -40 _ci/matches.txt
          else
            echo "found_matches=false" >> "$GITHUB_OUTPUT"
            echo "(no property-relevant items in last poll — ${ok}/${total} feeds healthy)"
          fi

          echo "feeds_ok=${ok}" >> "$GITHUB_OUTPUT"
          echo "feeds_total=${total}" >> "$GITHUB_OUTPUT"

      - name: Upload feed snapshot
        if: steps.feeds.outputs.found_matches == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: feeds-${{ github.run_id }}
          path: _ci/
          retention-days: 30

      - name: Open issue when matches found
        if: steps.feeds.outputs.found_matches == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const matches = fs.readFileSync('_ci/matches.txt', 'utf-8');
            const dead = fs.readFileSync('_ci/dead-feeds.txt', 'utf-8').trim();
            const date = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const body = [
              `Property-relevant items detected in the last feed poll (${date} UTC).`,
              ``,
              `Coverage: ${{ steps.feeds.outputs.feeds_ok }}/${{ steps.feeds.outputs.feeds_total }} feeds healthy.`,
              ``,
              `**Triage steps**:`,
              `1. Read each item; rate impact tier (1=CRITICAL/30d revisit ... 4=INCREMENTAL).`,
              `2. If Tier 1-3, add an entry to \`skills/property-deep-dive/shared/regulatory-watch.md\`.`,
              `3. If a country playbook is affected, queue an \`--update --refresh-only --country=<iso2>\` run.`,
              ``,
              `## Matches`,
              ``,
              matches,
              ...(dead ? [``, `## ⚠️ Degraded coverage`, ``, dead] : []),
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Regulatory feed signal — ${date} UTC`,
              body,
              labels: ['maintenance', 'regulatory-watch'],
            });

      # Runs last so a dead feed still lets the matches above reach an issue.
      # A silently-swallowed fetch failure is what let all three original feeds
      # rot to 404/403/soft-404 while the job reported green every day.
      - name: Fail if any feed is dead
        if: always() && steps.feeds.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -s _ci/dead-feeds.txt ]; then
            dead=$(grep -c '' _ci/dead-feeds.txt)
            echo "::error title=Dead regulatory feeds::${dead} of ${{ steps.feeds.outputs.feeds_total }} feeds are dead or blocked — fix the URL, fix the User-Agent, or drop the source"
            cat _ci/dead-feeds.txt
            exit 1
          fi
          echo "All ${{ steps.feeds.outputs.feeds_total }} feeds healthy."
