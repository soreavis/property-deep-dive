name: Feed watcher (regulatory signals)

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Fetch and filter regulatory feeds
        id: feeds
        run: |
          set -euo pipefail
          mkdir -p _ci

          # Property-relevant keywords (case-insensitive). Tune over time.
          KEYWORDS='property|real estate|housing|EPBD|short-let|short term rental|cadastre|land registry|stamp duty|transfer tax|capital gains|golden visa|residency|citizenship|mortgage|notary|landlord|tenancy|rental cap'

          : > _ci/matches.txt

          fetch_and_filter() {
            local name="$1" url="$2"
            curl -fsSL --max-time 15 \
              -H "User-Agent: property-deep-dive-ci/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              "$url" -o "_ci/${name}.xml" || { echo "  (failed to fetch $name)"; return 0; }
            # Extract <title> + <link> pairs, filter on keywords
            python3 - "$name" "_ci/${name}.xml" "$KEYWORDS" >> _ci/matches.txt <<'PY'
          import re, sys
          name, path, kw = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
              xml = f.read()
          # Crude RSS/Atom item parser
          items = re.findall(r'<item[^>]*>(.*?)</item>|<entry[^>]*>(.*?)</entry>', xml, re.DOTALL | re.IGNORECASE)
          pat = re.compile(kw, re.IGNORECASE)
          for it in items:
              chunk = it[0] or it[1]
              tm = re.search(r'<title[^>]*>(.*?)</title>', chunk, re.DOTALL | re.IGNORECASE)
              lm = re.search(r'<link[^>]*>(.*?)</link>|<link[^>]*href="([^"]+)"', chunk, re.IGNORECASE)
              if not tm: continue
              title = re.sub(r'<[^>]+>', '', tm.group(1)).strip()
              title = re.sub(r'\s+', ' ', title)
              if not pat.search(title):
                  continue
              link = ''
              if lm:
                  link = (lm.group(1) or lm.group(2) or '').strip()
              print(f"- **[{name}]** {title}")
              if link:
                  print(f"  - <{link}>")
          PY
          }

          # Curated feeds. Add more as you discover them.
          fetch_and_filter "EU-OJ-L"  "https://eur-lex.europa.eu/EN/display-feed.rss?myRssId=oj-l-en"
          fetch_and_filter "ECJ-PR"   "https://curia.europa.eu/jcms/upload/docs/application/xml/2024-01/cp_en.xml" || true
          fetch_and_filter "OECD-Tax" "https://www.oecd.org/tax/feed/" || true

          if [ -s _ci/matches.txt ]; then
            echo "found_matches=true" >> "$GITHUB_OUTPUT"
            head -20 _ci/matches.txt
          else
            echo "found_matches=false" >> "$GITHUB_OUTPUT"
            echo "(no property-relevant items in last poll)"
          fi

      - name: Upload feed snapshot
        if: steps.feeds.outputs.found_matches == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: feeds-${{ github.run_id }}
          path: _ci/
          retention-days: 30

      - name: Open issue when matches found
        if: steps.feeds.outputs.found_matches == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const matches = fs.readFileSync('_ci/matches.txt', 'utf-8');
            const date = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const body = [
              `Property-relevant items detected in the last feed poll (${date} UTC).`,
              ``,
              `**Triage steps**:`,
              `1. Read each item; rate impact tier (1=CRITICAL/30d revisit ... 4=INCREMENTAL).`,
              `2. If Tier 1-3, add an entry to \`shared/regulatory-watch.md\`.`,
              `3. If a country playbook is affected, queue an \`--update --refresh-only --country=<iso2>\` run.`,
              ``,
              `## Matches`,
              ``,
              matches,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Regulatory feed signal — ${date} UTC`,
              body,
              labels: ['maintenance', 'regulatory-watch'],
            });
