name: Internal link check

on:
  schedule:
    # Weekly Friday 09:00 UTC (counterpoint to Monday url-liveness).
    # Per-PR/per-push triggers were dropped 2026-05-01 — they fired on every
    # markdown change and mostly duplicated url-liveness coverage. The weekly
    # cron is sufficient for internal-link rot, and url-liveness already
    # catches external-URL rot.
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Lychee internal link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee (internal links only — external are covered by url-liveness.yml)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2
        with:
          # Note: deliberately NOT using --include-fragments. Anchor IDs vary across
          # renderers (em-dashes, doubled hyphens, special chars), and validating them
          # produces false positives. We check that target files exist; anchor accuracy
          # is hand-reviewed during PR.
          args: >-
            --offline
            --no-progress
            --exclude-path _local
            --exclude-path node_modules
            --exclude-path .git
            './**/*.md'
          fail: true

      - name: Open issue on schedule failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Internal link check failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Lychee detected broken **internal** Markdown links on the scheduled run.\n\nSee the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['maintenance', 'documentation'],
            });
