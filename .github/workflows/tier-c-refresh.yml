name: Tier-C refresh reminder (annual)

on:
  schedule:
    # 15 Jan at 09:00 UTC
    - cron: '0 9 15 1 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    uses: ./.github/workflows/_tier-refresh.yml
    with:
      tier_letter: C
      cadence_label: annual
      cadence_days: 365
      threshold_warn_days: 335
      extra_footer_note: "Tier-C is large (42 countries) — consider splitting across multiple sessions or running with `--validate-only` first to triage."
    permissions:
      contents: read
      issues: write
