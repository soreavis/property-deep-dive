name: EU transposition deadline alerts

# Weekly (Monday) cron parses skills/property-deep-dive/shared/regulatory-watch.md for entries
# with a future effective_date and fires a one-time issue for the most-urgent
# not-yet-passed threshold among:
#   T-90 days · T-30 days · T-14 days · T-0 (effective today)
#
# One issue per (entry, threshold) pair — title includes the threshold so
# subsequent runs don't duplicate. The full alert ladder gives the maintainer
# three lead-time windows (quarter-out planning · final pass · last-chance)
# plus the day-of marker that triggers the playbook patch.

on:
  schedule:
    # Weekly Monday 06:30 UTC — was daily until 2026-05-01. T-90/30/14/0
    # threshold ladder doesn't need daily granularity (a deadline crossing
    # a threshold mid-week gets caught by the next Monday at worst, and
    # the window that matters in practice is T-14 / T-0).
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Scan regulatory-watch for upcoming effective dates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute alerts payload
        id: scan
        run: |
          # Note: NO shell redirect to _alerts.json here. The Python below
          # writes the JSON via json.dump(); a shell `> _alerts.json` would
          # capture the print() lines too and overwrite the JSON, breaking
          # the JSON.parse in the next step.
          python3 - <<'PY'
          import json, re
          from datetime import date

          today = date.today()
          THRESHOLDS = [90, 30, 14, 0]

          path = 'skills/property-deep-dive/shared/regulatory-watch.md'
          with open(path, encoding='utf-8') as f:
              text = f.read()

          # Multi-country headers (e.g. "### 🇸🇪 SE / 🇫🇮 FI / 🇳🇴 NO") must attribute each
          # entry correctly. Mirror scripts/regwatch_promotions.py: a `### ` line is a
          # country header ONLY when it carries a regional-indicator-symbol codepoint;
          # capture ALL ISO2 codes in it. For each entry, if its sections field carries a
          # trailing "(XX)" ISO tag in the header set, attribute to that single country;
          # otherwise fan the entry out to every ISO in the header.
          iso2_re = re.compile(r'\b([A-Z]{2})\b')
          sections_iso_re = re.compile(r'\(([A-Z]{2})\)\s*$')
          # Entry: backtick-delimited 8-field row. Field 0 may include "(pending)" suffix.
          entry_re = re.compile(r'^[-*]\s+`([^`]+)`\s*$')

          alerts = []
          current_isos = []
          for raw in text.splitlines():
              if raw.startswith('### '):
                  if any(0x1F1E6 <= ord(c) <= 0x1F1FF for c in raw):
                      current_isos = iso2_re.findall(raw.split('###', 1)[1])
                  else:
                      current_isos = []
                  continue
              m_e = entry_re.match(raw)
              if not m_e or not current_isos:
                  continue
              parts = [p.strip() for p in m_e.group(1).split('|')]
              if len(parts) < 7:
                  continue
              effective_field = parts[0]
              # Accept "YYYY-MM-DD" or "YYYY-MM-DD (pending)"; skip ranges and "XX-XX" placeholders.
              m_d = re.match(r'^(\d{4}-\d{2}-\d{2})(?:\s*\(.*\))?$', effective_field)
              if not m_d:
                  continue
              try:
                  effective = date.fromisoformat(m_d.group(1))
              except ValueError:
                  continue
              days_until = (effective - today).days
              if days_until < 0:
                  # Already in effect — handled by regulatory-watch-revisit.yml instead.
                  continue
              # The cron is weekly (Monday), so an exact days_until == thr match would
              # miss ~6 of every 7 crossings. Instead pick the single most-urgent
              # not-yet-passed threshold for this entry and fire one alert for it.
              # min() over thresholds still >= days_until selects the tightest window
              # (e.g. days_until=12 -> 14; days_until=0 -> 0). Idempotency is preserved
              # because the issue title carries the threshold and the dup-search skips
              # an already-opened (entry, threshold) pair.
              thr = min((t for t in THRESHOLDS if t >= days_until), default=None)
              if thr is None:
                  continue
              # Attribute: a trailing "(XX)" ISO tag in the sections field that is in this
              # header's ISO set pins the entry to that one country; otherwise fan out to all.
              sections_field = parts[7] if len(parts) > 7 else ''
              m_tag = sections_iso_re.search(sections_field)
              if m_tag and m_tag.group(1) in current_isos:
                  target_isos = [m_tag.group(1)]
              else:
                  target_isos = current_isos
              for iso in target_isos:
                  alerts.append({
                      'country': iso,
                      'topic': parts[1],
                      'summary': parts[2],
                      'source': parts[3],
                      'effective': m_d.group(1),
                      'tier': parts[6] if len(parts) > 6 else '?',
                      'sections': sections_field,
                      'threshold': thr,
                      'days_until': days_until,
                  })
          json.dump(alerts, open('_alerts.json', 'w'))
          print(f'{len(alerts)} alert(s) to fire today ({today.isoformat()}):')
          for a in alerts:
              print(f"  T-{a['threshold']:>3} · {a['country']} {a['topic']} · {a['effective']}")
          PY

      - name: Open one issue per alert (idempotent)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const alerts = JSON.parse(fs.readFileSync('_alerts.json', 'utf-8'));
            if (alerts.length === 0) {
              core.notice('No threshold crossings today.');
              return;
            }

            for (const a of alerts) {
              const labelTier = (a.threshold === 0) ? '🚨 EFFECTIVE TODAY'
                              : (a.threshold <= 14) ? '⏰ FINAL PASS'
                              : (a.threshold <= 30) ? '📅 ONE MONTH OUT'
                              : '🗓 ONE QUARTER OUT';
              const title = `🔔 Transposition T-${String(a.threshold).padStart(2, '0')} · ${a.country} ${a.topic} · ${a.effective}`;

              // Idempotency: skip if an issue with this exact title already exists (open OR closed).
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
                per_page: 5,
              });
              const dup = search.data.items.find(i => i.title === title);
              if (dup) {
                core.notice(`Skipping duplicate: #${dup.number} — ${title}`);
                continue;
              }

              const body = [
                `## ${labelTier} — ${a.country} ${a.topic}`,
                ``,
                `**Effective date**: \`${a.effective}\` (in **${a.days_until} day(s)**)`,
                `**Tier**: ${a.tier}  ·  **Source**: ${a.source}`,
                `**Affected sections**: \`${a.sections || '(none listed)'}\``,
                ``,
                `### Summary`,
                ``,
                a.summary,
                ``,
                `### What to do`,
                ``,
                a.threshold >= 90 ?
                  '- Add a `regulatory-watch.md` revision pass to next month\'s sweep.\n- Identify which playbook section(s) need patching and queue the research.\n- No content change required yet — keep the entry visible.' :
                a.threshold >= 30 ?
                  '- Draft the playbook patch in a feature branch (do not merge yet — wait for the rule to land).\n- Confirm the source URL still resolves and points at the final text.\n- Re-stamp `**Last verified**` AFTER the rule is in force, not before.' :
                a.threshold >= 14 ?
                  '- Final-pass the draft patch.\n- If the rule has been delayed (parliamentary slippage, ECJ ruling pending), update `regulatory-watch.md` `effective_date` and re-stamp this issue.' :
                  '- Patch every affected playbook today.\n- Re-stamp `**Last verified**` to today.\n- If the entry ENDS a programme, also update `skills/property-deep-dive/shared/visa-programs.md` AND the ENDED registry table at the top of `regulatory-watch.md`.',
                ``,
                `---`,
                ``,
                `Generated by \`.github/workflows/transposition-alerts.yml\` on its weekly run (Monday), which fires the most-urgent crossed threshold per entry. The next threshold cross is auto-fired by the same workflow.`,
              ].join('\n');

              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['transposition-alert', 'regulatory-watch', 'maintenance'],
              });
              core.notice(`Opened #${created.data.number}: ${title}`);
            }
