name: CHANGELOG on merge

# When a PR merges to main, append the PR title + author + link to
# CHANGELOG.md under [Unreleased] in the appropriate bucket (Added /
# Changed / Fixed / Security / Removed). Branch protection blocks direct
# pushes to main, so the bot accumulates entries on a single rolling
# branch (`chore/changelog-digest`) instead of opening a PR per merge.
# A separate weekly job (Monday 09:00 UTC) opens / marks ready the
# digest PR if the branch has unmerged entries, so a maintainer reviews
# at most one batched changelog PR per week instead of one per merge.
#
# Token: uses PR_BOT_TOKEN (fine-grained PAT, Contents:RW + Pull-requests:RW
# scoped to this repo only). The default GITHUB_TOKEN cannot be used here
# because GitHub's safety rule says any PR created by GITHUB_TOKEN does NOT
# trigger downstream workflows — meaning auto-merge-docs and pr-validate
# would never fire on the bot's PR, and it would sit forever with 0 checks.
# A PAT-created PR triggers workflows normally.
#
# Concurrency: the `changelog-digest` group is shared by the append job
# and the weekly flip job, with `cancel-in-progress: false`, so two PR
# merges that close within seconds of each other queue rather than race
# (each rebases on the latest main + branch tip in turn).
#
# Skip conditions for the append job:
#   - PR not merged
#   - PR has label `skip changelog`
#   - PR head ref is the rolling digest branch itself (anti-loop)
#   - PR head ref begins with `chore/changelog-from-pr-` (legacy anti-loop;
#     left in place for any in-flight branches still on the remote)
#   - PR opened by github-actions[bot] (anti-loop)

on:
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    # Mondays 09:00 UTC — flip the rolling digest into a ready PR if it
    # has unmerged entries. Cron timing chosen to land at the start of
    # the maintainer's review window.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Manual flip — useful when a release is being cut mid-week and the
    # digest needs to merge before the version-tag workflow runs.

permissions:
  contents: read

# Shared by the append + flip jobs so simultaneous PR merges (and a
# scheduled flip racing with an append) queue rather than collide. We
# pick `cancel-in-progress: false` because skipping a queued append
# would lose a CHANGELOG entry — every merged PR must be recorded.
concurrency:
  group: changelog-digest
  cancel-in-progress: false

jobs:
  append:
    name: Append PR to rolling CHANGELOG digest
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.user.login != 'github-actions[bot]'
      && github.event.pull_request.head.ref != 'chore/changelog-digest'
      && !startsWith(github.event.pull_request.head.ref, 'chore/changelog-from-pr-')
      && !contains(github.event.pull_request.labels.*.name, 'skip changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # PAT (not GITHUB_TOKEN) so the bot's subsequent push triggers
          # downstream workflows on the digest branch.
          token: ${{ secrets.PR_BOT_TOKEN }}

      - name: Compute bucket from PR labels
        id: bucket
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # Map of label → bucket. First match wins; falls back to "Changed".
          # The labels here come from .github/labels.yml; keep this list synced.
          bucket="Changed"
          while IFS= read -r label; do
            case "$label" in
              security) bucket="Security"; break ;;
              enhancement|feature|new-country|new-section) bucket="Added"; break ;;
              bug|fix|factual-correction|broken-url) bucket="Fixed"; break ;;
              removed|deprecated) bucket="Removed / Deprecated"; break ;;
              breaking) bucket="Breaking"; break ;;
            esac
          done < <(printf '%s' "$LABELS" | jq -r '.[]?')
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "Bucket resolved: $bucket"

      - name: Switch to rolling digest branch (rebased on main)
        env:
          DIGEST_BRANCH: chore/changelog-digest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # If the rolling digest branch already exists on the remote, fetch
          # it and rebase onto the latest main so the diff stays clean (no
          # stale unrelated commits leaking in once main moves forward).
          # Otherwise start fresh from main.
          # We fetch into the remote-tracking ref (not directly into a local
          # branch) so `git push --force-with-lease=origin/<branch>` below
          # has a baseline to compare against — the alternative form
          # `git fetch origin <src>:<dst>` skips the remote-tracking update.
          if git ls-remote --exit-code --heads origin "$DIGEST_BRANCH" >/dev/null 2>&1; then
            echo "Digest branch exists on origin — rebasing on main."
            git fetch origin "$DIGEST_BRANCH"
            git checkout -B "$DIGEST_BRANCH" "origin/$DIGEST_BRANCH"

            # Self-heal: if the rebase conflicts on CHANGELOG.md, the most
            # likely cause is a manual `[Unreleased]` -> `[YYYY.0M.MICRO]`
            # promotion landed on main mid-cycle (release-cut PR). The stale
            # commits on the digest branch were inserting into a `[Unreleased]`
            # section that no longer matches main's structure — and the
            # entries they added are now living in the release section anyway.
            # Abort the rebase, reset to fresh main, and let the append step
            # re-record this PR's entry from scratch. The idempotency check
            # in the next step (looking for `[#N](url)` already in the file)
            # protects against double-recording on the rare race where the
            # release cut hasn't fully landed.
            if ! git rebase origin/main; then
              echo "::notice::Rebase failed — likely a manual release cut on main. Aborting + resetting digest to fresh main."
              git rebase --abort
              git checkout -B "$DIGEST_BRANCH" origin/main
            fi
          else
            echo "Digest branch absent — creating from main."
            git checkout -b "$DIGEST_BRANCH"
          fi

      - name: Append entry to CHANGELOG.md
        id: edit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BUCKET: ${{ steps.bucket.outputs.bucket }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys

          path = 'CHANGELOG.md'
          with open(path, encoding='utf-8') as f:
              text = f.read()

          pr_number = os.environ['PR_NUMBER']
          pr_title  = os.environ['PR_TITLE']
          pr_author = os.environ['PR_AUTHOR']
          pr_url    = os.environ['PR_URL']
          bucket    = os.environ['BUCKET']

          # Defang markdown injection in the source PR title before pasting
          # it into CHANGELOG.md. Concrete cases this stops:
          #   - `[click here](http://evil.com)` would render as a clickable link
          #   - `![alt](http://tracker.com/img.png)` would load a tracker pixel
          #   - `<script>` would render as raw HTML (no execution but ugly)
          # We only need to escape `[`, `]`, and `<`. Backslash first so we
          # don't double-escape the escape itself. Backticks left alone — the
          # `fix(ci): bump v2 → v3` style is intentional. Newlines stripped
          # defensively (GitHub forbids them in titles, but if it ever didn't
          # they'd break the bullet-list format).
          def sanitize_md(s):
              s = s.replace('\r', ' ').replace('\n', ' ').strip()
              if len(s) > 200:
                  s = s[:197] + '…'
              return (s
                  .replace('\\', '\\\\')
                  .replace('[', '\\[')
                  .replace(']', '\\]')
                  .replace('<', '\\<'))

          pr_title = sanitize_md(pr_title)

          line = f"- {pr_title} ([#{pr_number}]({pr_url})) — by @{pr_author}"

          # Idempotency: if this exact bullet (matched by `[#N](url)`) is
          # already in the file, don't double-record. This protects against
          # the rare case where the workflow retries after a partial push
          # (rebase succeeded, push failed, run re-queued) and the same PR
          # event fires twice.
          marker = f"[#{pr_number}]({pr_url})"
          if marker in text:
              print(f'::notice::PR #{pr_number} already recorded in CHANGELOG.md — skipping.')
              with open('_skip', 'w') as f:
                  f.write('skip')
              sys.exit(0)

          # Locate [Unreleased] section. If absent, create it just above the
          # first version header.
          unreleased_re = re.compile(r'^## \[Unreleased\].*$', re.MULTILINE)
          if not unreleased_re.search(text):
              first_version_re = re.compile(r'^## \[\d{4}\.\d{2}\.\d+\]', re.MULTILINE)
              m = first_version_re.search(text)
              if m:
                  text = text[:m.start()] + "## [Unreleased]\n\n" + text[m.start():]
              else:
                  # Fall back to appending at the end.
                  text = text.rstrip() + "\n\n## [Unreleased]\n\n"

          # Now find the [Unreleased] block — bounded by the next ## header.
          start = unreleased_re.search(text).end()
          next_header = re.search(r'^## ', text[start:], re.MULTILINE)
          end = start + next_header.start() if next_header else len(text)
          block = text[start:end]

          # Parse the [Unreleased] block into sub-sections keyed by their
          # `### ` heading, MERGING any exact-duplicate sibling headings as we
          # go, then re-emit with at most one heading per text. This is both
          # the insert and a self-heal: the old string-slice insert always
          # appended into the FIRST `### Changed` it found and created a brand-
          # new one only when none existed — but if a same-text bucket later
          # appeared above it (a release-cut `[Unreleased]`->`[x.y.z]` promotion
          # restructuring the section, or a human edit), the branch ended up
          # with two `### Changed` siblings under [Unreleased]. Two same-text
          # siblings trip markdownlint MD024/no-duplicate-heading (siblings_only)
          # and red the digest PR (caught 2026-06-01). Parsing + collapsing
          # duplicates guarantees the new entry lands in the single canonical
          # bucket and heals any duplicate already sitting on the branch.
          block_lines = block.split('\n')
          preamble = []
          j = 0
          while j < len(block_lines) and not block_lines[j].startswith('### '):
              preamble.append(block_lines[j])
              j += 1
          order = []   # heading text, in first-seen order
          bodies = {}  # heading text -> list of verbatim content chunks
          while j < len(block_lines):
              heading = block_lines[j].rstrip()
              j += 1
              content = []
              while j < len(block_lines) and not block_lines[j].startswith('### '):
                  content.append(block_lines[j])
                  j += 1
              chunk = '\n'.join(content).strip('\n')
              if heading not in bodies:
                  bodies[heading] = []
                  order.append(heading)
              if chunk:
                  bodies[heading].append(chunk)

          # Find the target bucket among the now-unique headings. A suffixed
          # heading ("### Added — XX prep") counts as the same bucket, matching
          # the prior behaviour. Exact-duplicate headings have already been
          # merged above, so first-match is unambiguous.
          bucket_re = re.compile(rf'^### {re.escape(bucket)}\b')
          target = next((h for h in order if bucket_re.match(h)), None)
          if target is not None:
              bodies[target].append(line)
          else:
              target = f"### {bucket}"
              order.append(target)
              bodies[target] = [line]

          # Re-emit with canonical single-blank-line spacing. The block must
          # start with a blank line (separating it from the `## [Unreleased]`
          # header) and end with one (separating it from the next `## ` version
          # header). Each section's content is preserved verbatim; only the
          # whitespace AROUND sections is normalised.
          parts = []
          pre = '\n'.join(preamble).strip('\n')
          if pre:
              parts.append(pre)
          for heading in order:
              body = '\n\n'.join(bodies[heading])
              parts.append(f"{heading}\n\n{body}" if body else heading)
          new_block = '\n\n' + '\n\n'.join(parts) + '\n\n'

          new_text = text[:start] + new_block + text[end:]
          if new_text == text:
              print('::warning::CHANGELOG insert produced an identical file — nothing to commit.')
              with open('_skip', 'w') as f:
                  f.write('skip')
              sys.exit(0)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(new_text)
          print(f'Appended to bucket "{bucket}":')
          print(f'  {line}')
          PY

          if [ -f _skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            rm -f _skip
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push to rolling digest branch
        if: steps.edit.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUCKET: ${{ steps.bucket.outputs.bucket }}
          DIGEST_BRANCH: chore/changelog-digest
        run: |
          set -euo pipefail
          git add CHANGELOG.md
          git commit -m "chore(changelog): record #${PR_NUMBER} under [Unreleased] § ${BUCKET}"

          # Two cases:
          #   - Branch is brand-new (no remote-tracking ref) → plain push -u.
          #   - Branch already on remote (we rebased onto main) → push with
          #     `--force-with-lease` so we don't clobber a concurrent push
          #     (the lease check fails fast if someone else moved the tip
          #     while we were running). Bare `--force-with-lease` (no value)
          #     auto-reads the expected SHA from the branch's upstream
          #     tracking ref. The previous `=origin/<branch>` form passed a
          #     local remote-tracking name as the lease refname — git tried
          #     to resolve `refs/remotes/origin/origin/<branch>` (doesn't
          #     exist), the lease silently degraded, and the bare push got
          #     rejected as non-fast-forward.
          if git rev-parse --verify --quiet "refs/remotes/origin/${DIGEST_BRANCH}" >/dev/null; then
            git push --force-with-lease origin "$DIGEST_BRANCH"
          else
            git push -u origin "$DIGEST_BRANCH"
          fi
          echo "::notice::Appended PR #${PR_NUMBER} to ${DIGEST_BRANCH}. PR will be opened by the weekly flip job."

  flip:
    name: Flip rolling digest into a ready PR (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PR_BOT_TOKEN }}

      - name: Open / mark-ready the digest PR if entries are pending
        env:
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          DIGEST_BRANCH: chore/changelog-digest
        run: |
          set -euo pipefail

          # No digest branch on the remote → nothing to flip this week.
          if ! git ls-remote --exit-code --heads origin "$DIGEST_BRANCH" >/dev/null 2>&1; then
            echo "::notice::No ${DIGEST_BRANCH} branch on origin — nothing to flip this week."
            exit 0
          fi

          git fetch origin "$DIGEST_BRANCH":"$DIGEST_BRANCH"
          ahead=$(git rev-list --count "origin/main..${DIGEST_BRANCH}")
          if [ "$ahead" -eq 0 ]; then
            echo "::notice::${DIGEST_BRANCH} has no commits ahead of main — nothing to flip."
            exit 0
          fi
          echo "::notice::${DIGEST_BRANCH} has ${ahead} unmerged commit(s) ahead of main."

          # Build a body listing every PR recorded in this digest cycle.
          # We grep CHANGELOG.md on the digest tip for `[#N](url)` markers
          # added since main; this makes the PR description self-describing
          # without re-parsing commit messages.
          recorded_prs=$(git diff "origin/main..${DIGEST_BRANCH}" -- CHANGELOG.md \
            | grep -E '^\+.*\[#[0-9]+\]\(' \
            | sed -E 's/^\+//' \
            || true)

          # Look for an existing PR from this branch (any state).
          existing_json=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "$DIGEST_BRANCH" \
            --state open \
            --json number,isDraft \
            --limit 1)
          existing_number=$(echo "$existing_json" | jq -r '.[0].number // empty')
          existing_draft=$(echo "$existing_json" | jq -r '.[0].isDraft // empty')

          # Use a quoted heredoc (no shell interpolation) so backticks in
          # the markdown are literal. Inject the dynamic fields via env-var
          # substitution after the fact.
          export AHEAD="$ahead"
          export RECORDED_PRS="${recorded_prs:-(see CHANGELOG.md diff)}"
          body=$(cat <<'EOF' | envsubst '$AHEAD $RECORDED_PRS'
          Automated weekly CHANGELOG digest — $AHEAD merged PR(s) recorded under `[Unreleased]`.

          ### Entries in this digest

          $RECORDED_PRS

          ---

          This PR will be auto-merged once required checks pass (see `auto-merge-docs.yml`). Skip individual source PRs from the digest by adding the `skip changelog` label to the source PR before it merges.
          EOF
          )

          if [ -z "$existing_number" ]; then
            echo "Creating new digest PR."
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "$DIGEST_BRANCH" \
              --title "chore(changelog): weekly digest — ${ahead} entry batch" \
              --body "$body" \
              --label "documentation" \
              --label "skip changelog"
          elif [ "$existing_draft" = "true" ]; then
            echo "Existing draft PR #${existing_number} — marking ready."
            gh pr ready "${existing_number}" --repo "${GITHUB_REPOSITORY}"
          else
            echo "::notice::Existing ready PR #${existing_number} — no flip needed (auto-merge will handle it)."
          fi
