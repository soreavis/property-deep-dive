name: PR validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  requirements-lock:
    name: requirements.txt matches requirements.in
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          # setup-uv installs "latest" when this is unset, and the step below is a
          # byte-exact comparison — so a uv release changing its output format would
          # red main repo-wide with no commit behind it. Bump deliberately; if a bump
          # ever alters the rendering, `./scripts/lock-requirements.py` regenerates.
          version: "0.12.2"

      - name: Check the lock is not stale
        # Editing requirements.in without recompiling leaves CI installing the
        # OLD requirements.txt with nothing to notice — the install still passes
        # because the stale lock is internally consistent. This is the only thing
        # that catches it. Resolution is pinned to the runner's platform inside
        # the script, so this is reproducible rather than machine-dependent.
        #
        # The unit tests guard the property that makes this check trustworthy:
        # resolution keeps the pins already in requirements.txt. Without that it
        # answers "has anything newer shipped", which is not a PR's problem.
        run: |
          python3 scripts/lock-requirements-test.py
          python3 scripts/lock-requirements.py --check

  changelog-length:
    name: CHANGELOG entries stay short
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cap [Unreleased] bullet length
        # CHANGELOG.md hit 512 KB across 946 lines — the driver was entry length,
        # not release count (median bullet 288 chars, p90 2,467, longest 13,073).
        # Released sections are grandfathered; this only guards new entries.
        run: python3 scripts/check-changelog-length.py --check

  regwatch-parse:
    name: regulatory-watch entries all parse
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Every entry is reachable by the schedulers
        # An entry that fails to parse is not a formatting nit — it is invisible to
        # regulatory-watch-revisit.yml and transposition-alerts.yml, which then report
        # "no overdue entries" while the entry sits unchecked. That is exactly how six
        # entries (two Tier-1, one 30 days past due) went unnoticed while every gate
        # was green. Nothing else in CI reads these rows.
        run: |
          python3 scripts/regwatch_parse-test.py
          python3 scripts/regwatch_parse.py --check

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe  # v24.1.0
        with:
          globs: |
            **/*.md
            !_local/**
            !node_modules/**

  forbidden-phrasings:
    name: Anti-hallucination — forbidden phrasings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # Full depth. `--depth=1` re-grafts a shallow origin/<base>, which
            # destroys the merge base and makes `$base...HEAD` die with
            # "fatal: no merge base" whenever <base> advanced after this PR
            # branched (checkout already fetched full history via fetch-depth: 0).
            git fetch origin "${{ github.base_ref }}" || true
            git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.md' > _ci_changed.txt
          else
            # push to main — scan everything
            find . -name '*.md' \
              ! -path './_local/*' \
              ! -path './node_modules/*' \
              ! -path './.git/*' \
              > _ci_changed.txt
          fi
          # Allowlist files where forbidden phrasings ARE expected (the rules + their documentation).
          # docs/ is excluded entirely — the docs folder explains the contract (and so quotes the
          # forbidden phrases) rather than producing skill output.
          # Match docs/ both with and without a leading ./ — `git diff --name-only` (PR runs)
          # emits paths like `docs/security.md` while `find . -name '*.md'` (push runs) emits
          # `./docs/security.md`. Allowlisting only one form silently lets the other through.
          grep -vE '(anti-hallucination\.md|foreign-language-preservation\.md|README\.md|CONTRIBUTING\.md|CLAUDE\.md|SECURITY\.md|CODE_OF_CONDUCT\.md|CHANGELOG\.md|SKILL\.md|pull_request_template\.md)$|^(\./)?docs/' _ci_changed.txt > _ci_scan.txt || true
          echo "Files to scan: $(wc -l < _ci_scan.txt)"

      - name: Scan for forbidden phrasings
        run: |
          set -euo pipefail
          if [ ! -s _ci_scan.txt ]; then
            echo "No relevant changed files — skipping."
            exit 0
          fi

          # Patterns that always fail (no number context needed)
          ALWAYS_FAIL='industry average|experts say|studies show|typical for the region|as of recent data|in the area of|is likely connected to'

          # Patterns that fail only when followed by a numeric context (digit, currency, %)
          NEAR_NUMBER='approximately +[0-9€$£¥]|should be around +[0-9€$£¥]|in the range of +[0-9€$£¥]|circa +[0-9€$£¥]'

          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            if grep -inE "$ALWAYS_FAIL" "$f"; then
              echo "::error file=$f::Forbidden phrasing (always-fail) — see skills/property-deep-dive/shared/anti-hallucination.md § Forbidden phrasings"
              fail=1
            fi
            if grep -inE "$NEAR_NUMBER" "$f"; then
              echo "::error file=$f::Forbidden phrasing near a number — replace with sourced/computed/hedged value"
              fail=1
            fi
          done < _ci_scan.txt

          if [ "$fail" -eq 1 ]; then
            echo
            echo "Replacement table: skills/property-deep-dive/shared/anti-hallucination.md § Forbidden phrasings"
            exit 1
          fi
          echo "✅ No forbidden phrasings found."

  last-verified-stamp:
    name: Country playbook — Last verified stamp present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed playbooks have Status footer stamps
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # Full depth — see the "no merge base" note in the anti-hallucination job.
            git fetch origin "${{ github.base_ref }}" || true
            changed=$(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- 'skills/property-deep-dive/countries/*/playbook.md' || true)
          else
            changed=$(find skills/property-deep-dive/countries -name 'playbook.md' 2>/dev/null || true)
          fi
          [ -z "$changed" ] && { echo "No playbook changes — skipping."; exit 0; }

          fail=0
          for f in $changed; do
            [ ! -f "$f" ] && continue
            # Accept either format: 'as of YYYY-MM-DD' (canonical, used by health-report decay rule)
            # or '**Last verified**: YYYY-MM-DD' (alternate form documented in CONTRIBUTING).
            if ! grep -qE '(as of +|\*\*Last verified\*\*: *)[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f"; then
              echo "::error file=$f::Missing date stamp — playbook must contain 'as of YYYY-MM-DD' or '**Last verified**: YYYY-MM-DD'"
              fail=1
            fi
            if ! grep -qE '\*\*Confidence\*\*' "$f"; then
              echo "::error file=$f::Missing **Confidence** stamp in Status footer"
              fail=1
            fi
          done
          [ "$fail" -eq 1 ] && exit 1
          echo "✅ All changed playbooks have Status footer stamps."

  personal-data:
    name: Personal-data leak guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan for the canonical worked-example personal address
        run: |
          set -euo pipefail
          # The skill's worked example uses placeholder addresses — this guard
          # catches accidental commits of the maintainer's real test address.
          if grep -rniE 'REDACTED-ADDRESS' --include='*.md' . | grep -v 'placeholder\|example\|generic'; then
            echo "::error::Found a private worked-example address. Use placeholder addresses (CONTRIBUTING.md § Privacy + repo hygiene)."
            exit 1
          fi
          echo "✅ No personal-data leak detected."

  section-completeness:
    name: Country playbook — minimum density + key sections
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine changed playbooks
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            # Full depth — see the "no merge base" note in the anti-hallucination job.
            git fetch origin "${{ github.base_ref }}" || true
            git diff --name-only --diff-filter=ACMR "$base...HEAD" -- 'skills/property-deep-dive/countries/*/playbook.md' > _changed.txt
          else
            find skills/property-deep-dive/countries -name 'playbook.md' > _changed.txt 2>/dev/null || true
          fi
          echo "playbooks=$(wc -l < _changed.txt)"

      - name: Check minimum density + key sections
        run: |
          set -euo pipefail
          [ ! -s _changed.txt ] && { echo "No playbook changes — skipping."; exit 0; }
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            iso2=$(basename "$(dirname "$f")")
            lines=$(wc -l < "$f")
            # Hard floor: 250 lines (well below FR/IT/CZ/SK ~400-500 bar; flags grossly truncated playbooks)
            if [ "$lines" -lt 250 ]; then
              echo "::error file=$f::Playbook ${iso2^^} is only $lines lines — below the 250-line floor. FR/IT/CZ/SK density is ~400-500 lines."
              fail=1
            fi
            # Key markers — every country playbook should mention these
            for marker in 'cadastr|land registry' 'tax|stamp duty|transfer' 'risk|flood|earthquake|seismic'; do
              if ! grep -qiE "$marker" "$f"; then
                echo "::warning file=$f::Playbook ${iso2^^} missing expected marker: $marker"
              fi
            done
          done < _changed.txt
          [ "$fail" -eq 1 ] && exit 1
          echo "✅ All changed playbooks meet the minimum-density bar."

  argument-hint-drift:
    name: SKILL.md argument-hint ↔ README sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Compare argument-hint flags vs README mentions
        run: |
          python3 - <<'PY'
          import re, sys

          with open('skills/property-deep-dive/SKILL.md', encoding='utf-8') as f:
              content = f.read()
          m = re.search(r'argument-hint:\s*"([^"]+)"', content)
          if not m:
              print("::warning::Could not parse SKILL.md argument-hint")
              sys.exit(0)
          hint = m.group(1)
          flags = set(re.findall(r'--([a-z][a-z0-9-]*)', hint))

          # Output / control flags that don't need README user-facing entries.
          # Keep this list explicit so adding a new section flag stays caught.
          output_only = {
              'save', 'quick', 'deep', 'override-confidence', 'listing', 'add',
              'diff', 'interactive', 'test', 'all', 'country', 'update',
              'tco', 'mortgage', 'watch', 'health-report',
              'validate-only', 'refresh-only',
              'lang', 'lang-scope',
              'tier', 'include', 'exclude',
              'match',
          }
          section_flags = sorted(flags - output_only)

          with open('README.md', encoding='utf-8') as f:
              readme = f.read()
          missing = [fl for fl in section_flags if f'--{fl}' not in readme]

          print(f"Section flags in SKILL.md argument-hint: {len(section_flags)}")
          for fl in section_flags:
              status = "✗" if fl in missing else "✓"
              print(f"  {status} --{fl}")

          if missing:
              print(f"\n::error file=SKILL.md::Argument-hint drift: {missing} appear in SKILL.md but not in README.md. Update README §Sections.")
              sys.exit(1)
          print("\n✅ All section flags in SKILL.md argument-hint are mentioned in README.md.")
          PY

  matrix-consistency:
    name: Country matrix ↔ countries/* audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compare matrix to filesystem
        # Two-way audit between SKILL.md country support matrix and
        # skills/property-deep-dive/countries/<iso2>/playbook.md filesystem.
        # Catches: matrix lists `lt` but folder is missing; folder exists but
        # no row in matrix; tagline drift (advisory).
        run: |
          python3 - <<'PY'
          import os, re, sys

          with open('skills/property-deep-dive/SKILL.md', encoding='utf-8') as f:
              content = f.read()
          m_section = re.search(
              r'^## Country support matrix\b(.*?)(?=^## )',
              content, re.MULTILINE | re.DOTALL,
          )
          if not m_section:
              print('::error file=skills/property-deep-dive/SKILL.md::Could not find "## Country support matrix" section.')
              sys.exit(1)
          rows = re.findall(r'^\|\s*\*\*([a-z]{2})\*\*\s*\|', m_section.group(1), re.MULTILINE)
          matrix_iso2 = sorted(set(rows))

          countries_dir = 'skills/property-deep-dive/countries'
          fs_iso2 = []
          if os.path.isdir(countries_dir):
              for entry in sorted(os.listdir(countries_dir)):
                  full = os.path.join(countries_dir, entry)
                  if os.path.isdir(full) and re.fullmatch(r'[a-z]{2}', entry):
                      if os.path.isfile(os.path.join(full, 'playbook.md')):
                          fs_iso2.append(entry)
          fs_iso2 = sorted(set(fs_iso2))

          missing_playbook    = [iso for iso in matrix_iso2 if iso not in fs_iso2]
          orphan_playbook     = [iso for iso in fs_iso2 if iso not in matrix_iso2]
          duplicate_in_matrix = [iso for iso in set(rows) if rows.count(iso) > 1]

          print(f"Countries in SKILL.md matrix : {len(matrix_iso2)}")
          print(f"Countries on filesystem      : {len(fs_iso2)}")
          print(f"Missing playbook (matrix, no folder)  : {missing_playbook}")
          print(f"Orphan  playbook (folder, no matrix)  : {orphan_playbook}")
          print(f"Duplicate matrix rows                 : {duplicate_in_matrix}")

          tagline = re.search(r'(\d+)\s+countries fully populated', content)
          tagline_count = int(tagline.group(1)) if tagline else None
          if tagline_count is not None and tagline_count != len(matrix_iso2):
              print(f"::warning file=skills/property-deep-dive/SKILL.md::Tagline says \"{tagline_count} countries fully populated\" but matrix has {len(matrix_iso2)}. Update the tagline.")

          fail = False
          for iso in missing_playbook:
              print(f"::error file=skills/property-deep-dive/SKILL.md::Matrix lists `{iso}` but skills/property-deep-dive/countries/{iso}/playbook.md is missing.")
              fail = True
          for iso in orphan_playbook:
              print(f"::error file=skills/property-deep-dive/countries/{iso}/playbook.md::Playbook exists but no row in SKILL.md country matrix.")
              fail = True
          for iso in duplicate_in_matrix:
              print(f"::error file=skills/property-deep-dive/SKILL.md::Duplicate matrix row for `{iso}` — keep one canonical row.")
              fail = True

          if fail:
              sys.exit(1)
          print('✅ Matrix and filesystem agree.')
          PY

  version-month-guard:
    name: Version month guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce CalVer month on plugin.json version change
        # Anti-drift guard. The release tag always follows plugin.json's
        # `version`, so if a bump lands in last month's namespace (what happened
        # when 2026.05.x kept being bumped through June) the release would tag
        # under the wrong month. Diff-gated: passes instantly when the version
        # is unchanged; fails only when a *change* breaks the CalVer rules
        # (0M = calendar month; MICRO resets on month roll; monotonic in-month).
        # All rule logic lives in scripts/next-version.py (single source of
        # truth, self-tested) so the agent's release command and this gate agree.
        run: |
          set -euo pipefail
          file=".claude-plugin/plugin.json"
          ver_at() {
            git show "$1:$file" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null \
              || true
          }

          head_ver=$(python3 -c "import json; print(json.load(open('$file'))['version'])")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Full depth — see the "no merge base" note in the anti-hallucination job.
            git fetch origin "${{ github.base_ref }}" || true
            base_ver=$(ver_at "origin/${{ github.base_ref }}")
          else
            base_ver=$(ver_at "HEAD~1")
          fi
          echo "base version: ${base_ver:-<none>}"
          echo "head version: ${head_ver}"

          if [ "$base_ver" = "$head_ver" ]; then
            echo "::notice::plugin.json version unchanged (${head_ver}) — guard passes."
            exit 0
          fi

          echo "Version changed ${base_ver:-<none>} -> ${head_ver}; validating against CalVer rules…"
          python3 scripts/next-version.py --check "$head_ver" --base "${base_ver:-}"
