name: Auto-merge docs PRs

# Enables auto-merge (squash) on PRs that satisfy ALL of:
#   - Have label `documentation`
#   - NOT marked as draft
#   - Don't carry a blocking label (`wip`, `do-not-merge`, `blocked`)
#   - Author is the maintainer OR a known automation bot
#     (changelog-on-merge bot, dependabot — never an arbitrary external)
#
# `gh pr merge --auto` queues the merge: GitHub waits until all required
# checks pass and only then squashes. If a required check fails, the PR
# stays open and a maintainer can intervene.
#
# Token: uses PR_BOT_TOKEN (PAT, Pull-requests:RW + Contents:RW on this
# repo only). The default GITHUB_TOKEN cannot be used here — the GraphQL
# `enablePullRequestAutoMerge` mutation rejects it with
# "Resource not accessible by integration". Same trust pattern as
# changelog-on-merge.yml (see PR #23 for the rationale + token setup).
#
# Why "documentation" only — content additions (new countries, regulatory
# updates, anti-hallucination edits) carry a hallucination risk that
# warrants manual review. Pure prose / docs / metadata edits don't.

on:
  pull_request:
    types: [labeled, opened, synchronize, ready_for_review, reopened]
  pull_request_target:
    types: [labeled, opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge if eligible
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: >-
      github.event.pull_request.draft == false
      && contains(github.event.pull_request.labels.*.name, 'documentation')
      && !contains(github.event.pull_request.labels.*.name, 'wip')
      && !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
      && !contains(github.event.pull_request.labels.*.name, 'blocked')
      && (
        github.event.pull_request.user.login == 'soreavis'
        || github.event.pull_request.user.login == 'github-actions[bot]'
        || github.event.pull_request.user.login == 'dependabot[bot]'
      )
    steps:
      - name: Enable squash auto-merge
        env:
          # PAT (not GITHUB_TOKEN). The enablePullRequestAutoMerge GraphQL
          # mutation rejects GITHUB_TOKEN ("Resource not accessible by
          # integration"). The PAT is user-attributed and works.
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Auto-merge enrolment is idempotent — repeated runs are no-ops once
          # already enabled. We capture stderr so a real error is visible
          # in the log (the previous version swallowed it via `if/else`).
          if gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --auto --squash 2>&1; then
            echo "::notice::Auto-merge enabled for PR #${PR_NUMBER}"
          else
            ec=$?
            echo "::warning::Auto-merge could not be enabled for PR #${PR_NUMBER} (exit ${ec}). See preceding gh CLI output for the real cause."
          fi
