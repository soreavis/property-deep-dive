name: Tier-B refresh reminder (semi-annual)

on:
  schedule:
    # 1st of Jan/Jul at 09:00 UTC
    - cron: '0 9 1 1,7 *'
  workflow_dispatch:

jobs:
  refresh:
    uses: ./.github/workflows/_tier-refresh.yml
    with:
      tier_letter: B
      cadence_label: semi-annual
      cadence_days: 180
      threshold_warn_days: 150
    permissions:
      contents: read
      issues: write
