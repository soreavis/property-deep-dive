version: 2
updates:
  # GitHub Actions — keep workflow action versions current.
  # Skill ships Markdown only, so no language-runtime ecosystems to track.
  # Auto-merge policy for the PRs this opens lives in
  # .github/workflows/dependabot-auto-merge.yml: patch/minor from any ecosystem
  # and major github_actions bumps land unattended once required checks pass.
  # Editing this file makes Dependabot re-read the config and check immediately,
  # which is the only way to force an off-schedule run without the UI button.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
