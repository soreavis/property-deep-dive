version: 2
updates:
  # GitHub Actions — keep workflow action versions current.
  # Skill ships Markdown only, so no language-runtime ecosystems to track.
  # Auto-merge policy for the PRs this opens lives in
  # .github/workflows/dependabot-auto-merge.yml: patch/minor from any ecosystem
  # and major github_actions bumps land unattended once required checks pass.
  # Editing this file makes Dependabot re-read the config and check immediately,
  # which is the only way to force an off-schedule run without the UI button.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # `monthly` runs on the 1st of the month. `time`/`timezone` apply to every
      # interval, but `day` is weekly-only — it was set to monday here and
      # silently ignored, implying a cadence that never existed. Don't re-add it
      # without switching `interval` to weekly.
      interval: monthly
      time: "09:00"
      timezone: Europe/Bratislava
    # 5 is GitHub's own default, restated for visibility. Security-update PRs
    # are exempt and don't count toward it. Raise only if batches start capping.
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Python deps for the scripts/ helpers CI runs (requirements.txt at root).
  # Dependabot regenerates the hashes alongside the version pins, which an
  # inline `pip install` in a workflow step could never give us.
  # Per dependabot-auto-merge.yml these are a real runtime ecosystem: patch and
  # minor land unattended, but a MAJOR bump here waits for human review.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
