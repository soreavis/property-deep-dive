name: Regulatory-watch entry
description: Log a tax / rental / visa / finance / ownership reform that should be tracked in shared/regulatory-watch.md and may invalidate one or more playbook sections
title: "[reg-watch] <iso2>: <topic> — <effective date>"
labels: ["regulatory-watch", "maintenance"]
body:
  - type: markdown
    attributes:
      value: |
        `shared/regulatory-watch.md` is the single date-stamped source of truth for "what changed when". Tier 1/2 entries can force-downgrade affected sections to STALE regardless of calendar age.

        **Bar**: primary government source (or Official Journal / Gazette), with effective date. News-site reporting alone is not enough — link to the official text.

  - type: input
    id: country
    attributes:
      label: Country (ISO2)
      description: Two-letter code, lowercase. Use `eu` for EU-wide directives.
      placeholder: pt
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - tax
        - rental
        - visa
        - finance
        - ownership
        - esg
        - cadastre
        - eurozone
        - other
    validations:
      required: true

  - type: input
    id: effective_date
    attributes:
      label: Effective date (YYYY-MM-DD)
      description: When the reform takes / took effect. If pending, use the announced date.
      placeholder: 2025-01-01
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: One-line summary
      description: Plain-English description of what changed.
      placeholder: |
        PT NHR pension exemption ended; replaced by IFICI (no pension benefit)
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Primary source URL
      description: Official journal, gazette, finance ministry page, or central bank announcement. Not a news article.
      placeholder: https://www.portaldasfinancas.gov.pt/...
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Impact tier
      description: |
        T1 = CRITICAL (reverses prior assertion, e.g. ENDED programme) — 30-day revisit
        T2 = MAJOR (material number change) — 90-day revisit
        T3 = MEANINGFUL (threshold tweak) — 180-day revisit
        T4 = INCREMENTAL (indexation, minor adjustment) — 365-day revisit
      options:
        - "T1 — CRITICAL (reverses prior assertion)"
        - "T2 — MAJOR (material number change)"
        - "T3 — MEANINGFUL (threshold tweak)"
        - "T4 — INCREMENTAL (indexation, minor adjustment)"
    validations:
      required: true

  - type: checkboxes
    id: ended_program
    attributes:
      label: Programme status (check if applicable)
      description: ENDED-programme entries are anti-hallucination critical and go in the dedicated registry table.
      options:
        - label: This reform ENDED a programme (golden visa, NHR-style regime, CBI scheme, tax holiday)
          required: false

  - type: textarea
    id: sections
    attributes:
      label: Affected `--<flag>` sections
      description: Which sections in country playbooks need re-stamping after this lands? List the flags.
      placeholder: |
        --tax (pension regime), --visa (NHR scheme), --retirement
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context (optional)
      description: Why is this important? Any related reforms? Pending challenges (ECJ ruling expected)?
    validations:
      required: false
